<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Desi Girl Viral Link</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://w.tads.me/widget.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <header>
    <div>
      <h1>Desi Girl Viral Link</h1>
      <p>Trending videos</p>
    </div>

    <div id="tgUser">Guest</div>
  </header>

  <div class="tabs">
    <button class="tab active" data-category="All">All</button>
    <button class="tab" data-category="Trending">Trending</button>
    <button class="tab" data-category="Funny">Funny</button>
    <button class="tab" data-category="Popular">Popular</button>
  </div>

  <main id="videoGrid"></main>

</div>

<!-- VIDEO MODAL -->

<div class="modal hidden" id="modal">

  <div class="modal-box">

    <button class="close" id="closeModal">×</button>

    <div class="preview" id="preview"></div>

    <h2 id="modalTitle"></h2>

    <p id="modalText">
      Watch ads to unlock this content.
    </p>

    <div class="progress">
      <span id="progressBar"></span>
    </div>

    <p id="watchAdBtn" class="watch-btn">
      Watch Ads (0/3)
    </p>

    <button
      class="video-btn"
      id="videoBtn"
      disabled>
      🔒 Video Locked
    </button>

  </div>

</div>

<script src="app.js"></script>

</body>
</html>
