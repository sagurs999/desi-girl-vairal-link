<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#f5f6fa"
  >

  <title>Desi Girl Viral Link</title>


  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>


  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <!-- Monetag SDK - KEEP THIS -->
  <script
    src="https://libtl.com/sdk.js"
    data-zone="11571866"
    data-sdk="show_11571866">
  </script>


  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <div class="app">


    <!-- ================= HEADER ================= -->

    <header class="top-header">

      <div class="brand-area">

        <div class="brand">
          Desi Girl Viral Link
        </div>

        <div class="sub-brand">
          Trending Viral Videos
        </div>

      </div>


      <div
        id="tgUser"
        class="tg-user"
      >
        Guest
      </div>

    </header>



    <!-- ================= CATEGORY TABS ================= -->

    <div class="category-wrapper">

      <div
        class="tabs"
        id="categoryTabs"
      >

        <button
          class="tab active"
          data-category="All"
        >
          All
        </button>


        <button
          class="tab"
          data-category="Viral Only"
        >
          Viral Only
        </button>


        <button
          class="tab"
          data-category="Expose"
        >
          Expose
        </button>


        <button
          class="tab"
          data-category="Tiktokk viral"
        >
          Tiktokk viral
        </button>

      </div>

    </div>



    <!-- ================= LOADING ================= -->

    <div
      id="loading"
      class="loading"
    >

      <div class="loader"></div>

      <p>
        Loading videos...
      </p>

    </div>



    <!-- ================= VIDEO GRID ================= -->

    <main
      id="videoGrid"
      class="video-grid"
    ></main>



    <!-- ================= EMPTY ================= -->

    <div
      id="emptyState"
      class="empty-state hidden"
    >

      <div class="empty-icon">
        🎬
      </div>

      <h3>
        No videos found
      </h3>

      <p>
        No published videos are available.
      </p>

    </div>



  </div>



  <!-- ================= VIDEO MODAL ================= -->

  <div
    id="videoModal"
    class="video-modal hidden"
  >

    <div class="modal-overlay"></div>


    <div class="modal-content">


      <button
        id="closeModal"
        class="modal-close"
      >
        ×
      </button>


      <div
        id="modalVideoArea"
        class="modal-video-area"
      ></div>


      <div class="modal-info">

        <h2 id="modalTitle">
          Video
        </h2>

        <p id="modalDescription">
          Video unlocked
        </p>

      </div>

    </div>

  </div>



  <!-- ================= APP JS ================= -->

  <script src="app.js"></script>


</body>

</html>
