<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Desi Girl Viral Link</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://w.tads.me/widget.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <header class="header">
      <div>
        <h1>Desi Girl Viral Link</h1>
        <p>Trending videos</p>
      </div>

      <div id="tgUser">Guest</div>
    </header>


    <nav class="tabs">
      <button class="tab active" data-category="All">All</button>
      <button class="tab" data-category="Trending">Trending</button>
      <button class="tab" data-category="Funny">Funny</button>
      <button class="tab" data-category="Popular">Popular</button>
    </nav>


    <main id="videoGrid" class="grid"></main>

  </div>


  <!-- Video Modal -->
  <div id="modal" class="modal hidden">

    <div class="modal-box">

      <button id="closeModal" class="close">×</button>

      <div id="preview" class="preview">🎬</div>

      <h2 id="modalTitle">Video</h2>

      <p id="modalText">
        Watch 3 ads to unlock this content.
      </p>

      <div class="progress-container">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <p id="watchAdBtn" class="ad-button">
        Watch Ads (0/3)
      </p>

      <button id="videoBtn" class="video-btn" disabled>
        🔒 Video Locked
      </button>

    </div>

  </div>


  <script src="app.js"></script>

</body>
</html>
