<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Desi Girl Viral Link</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://w.tads.me/widget.js"></script>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  background:#070b18;
  color:#fff;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
}

.app{
  min-height:100vh;
  padding:18px 14px 100px;
  background:
    radial-gradient(
      circle at 50% -10%,
      #18245a 0,
      #0b1025 42%,
      #070b18 100%
    );
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:4px 2px 20px;
}

.brand{
  font-size:26px;
  font-weight:900;
}

.sub{
  color:#9da7c3;
  margin-top:5px;
  font-size:16px;
}

.user{
  color:#aeb8d4;
  font-size:13px;
}

.tabs{
  display:flex;
  gap:9px;
  overflow-x:auto;
  margin-bottom:18px;
  padding-bottom:3px;
  scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tab{
  border:0;
  border-radius:24px;
  padding:13px 20px;
  background:#171d35;
  color:#aeb7d0;
  font-size:16px;
  font-weight:800;
  white-space:nowrap;
}

.tab.active{
  background:linear-gradient(135deg,#405cff,#873cff);
  color:#fff;
  box-shadow:0 8px 22px rgba(88,70,255,.28);
}

/* BIGGER VIDEO CARDS */

main{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
  align-items:start;
}

.card{
  background:linear-gradient(
    180deg,
    #151b32,
    #101528
  );

  border:1px solid #2a3150;
  border-radius:24px;
  overflow:hidden;

  box-shadow:
    0 12px 28px rgba(0,0,0,.25);

  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.card:active{
  transform:scale(.985);
}

.thumb{
  height:250px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0a0f20;
  overflow:hidden;
  cursor:pointer;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.thumb-placeholder{
  font-size:64px;
}

.card-body{
  padding:16px;
}

.card h3{
  margin:0 0 10px;

  font-size:21px;
  line-height:1.3;

  cursor:pointer;
}

.card h3:hover{
  text-decoration:underline;
}

/* VIEW + DATE */

.meta{
  color:#929cb8;
  font-size:14px;
  line-height:1.7;
  margin-bottom:14px;
}

.meta span{
  display:inline-block;
  margin-right:8px;
}

/* WATCH AD */

.open-btn{
  width:100%;

  border:0;
  border-radius:16px;

  padding:15px 10px;

  font-size:17px;
  font-weight:900;

  background:
    linear-gradient(
      135deg,
      #405cff,
      #833cff
    );

  color:#fff;
  cursor:pointer;
}

.open-btn:active{
  transform:scale(.98);
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:40px 20px;
  color:#9da7c3;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;

  background:rgba(2,4,13,.82);

  backdrop-filter:blur(9px);

  display:flex;
  align-items:center;
  justify-content:center;

  padding:14px;

  z-index:1000;
}

.modal.hidden{
  display:none;
}

.modal-box{
  width:100%;
  max-width:700px;

  max-height:94vh;
  overflow:auto;

  background:
    linear-gradient(
      145deg,
      #171d3a,
      #0f1730
    );

  border:1px solid #3a4580;
  border-radius:28px;

  padding:16px 16px 24px;

  box-shadow:
    0 24px 80px rgba(0,0,0,.55);
}

.close{
  float:right;

  border:0;

  background:#303957;
  color:#fff;

  width:42px;
  height:42px;

  border-radius:50%;

  font-size:25px;

  cursor:pointer;
}

.preview{
  clear:both;

  height:320px;

  border-radius:22px;

  background:#080d1c;

  overflow:hidden;

  display:flex;
  align-items:center;
  justify-content:center;

  margin:8px 0 18px;
}

.preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.preview-placeholder{
  font-size:80px;
}

.modal-box h2{
  font-size:28px;
  line-height:1.3;

  margin:0 0 8px;
}

.modal-info{
  display:flex;
  gap:8px;
  flex-wrap:wrap;

  color:#aab4d1;

  font-size:14px;

  margin-bottom:13px;
}

.modal-box p{
  color:#aab4d1;
  font-size:17px;
  margin:8px 0;
}

.progress{
  height:9px;

  background:#2b3453;

  border-radius:20px;

  overflow:hidden;

  margin:17px 0 8px;
}

.progress span{
  display:block;

  height:100%;
  width:0;

  background:
    linear-gradient(
      90deg,
      #19c8ff,
      #8640ff
    );

  transition:width .3s;
}

.progress-text{
  text-align:center;

  color:#aab4d1;

  font-size:15px;

  margin-bottom:16px;
}

.watch-btn,
.video-btn{
  width:100%;

  border:0;

  border-radius:17px;

  padding:16px;

  font-size:17px;
  font-weight:900;

  cursor:pointer;
}

.watch-btn{
  background:
    linear-gradient(
      135deg,
      #15bff3,
      #8640ff
    );

  color:#fff;
}

.watch-btn:disabled{
  opacity:.65;
  cursor:not-allowed;
}

.video-btn{
  margin-top:12px;

  background:#343c59;
  color:#aab4d1;
}

.video-btn.unlocked{
  background:
    linear-gradient(
      135deg,
      #16c79a,
      #0ea5e9
    );

  color:#fff;
}

/* MOBILE */

@media(max-width:520px){

  .app{
    padding:16px 10px 95px;
  }

  .brand{
    font-size:23px;
  }

  .sub{
    font-size:14px;
  }

  main{
    gap:13px;
  }

  .thumb{
    height:225px;
  }

  .card-body{
    padding:13px;
  }

  .card h3{
    font-size:18px;
  }

  .meta{
    font-size:12px;
  }

  .open-btn{
    padding:13px 8px;
    font-size:15px;
  }

  .modal-box{
    border-radius:25px;
  }

  .preview{
    height:285px;
  }

  .modal-box h2{
    font-size:25px;
  }
}
</style>
</head>

<body>

<div class="app">

  <header>

    <div>

      <div class="brand">
        🔐 Desi Girl Viral Link
      </div>

      <div class="sub">
        Trending Videos
      </div>

    </div>

    <div
      class="user"
      id="tgUser"
    >
      Guest
    </div>

  </header>


  <div class="tabs">

    <button
      class="tab active"
      data-category="All"
    >
      All
    </button>

    <button
      class="tab"
      data-category="Trending"
    >
      Trending
    </button>

    <button
      class="tab"
      data-category="Funny"
    >
      Funny
    </button>

    <button
      class="tab"
      data-category="Popular"
    >
      Popular
    </button>

  </div>


  <main id="videoGrid"></main>

</div>


<!-- VIDEO MODAL -->

<div
  class="modal hidden"
  id="modal"
>

  <div class="modal-box">

    <button
      class="close"
      id="closeModal"
    >
      ×
    </button>


    <div
      class="preview"
      id="preview"
    ></div>


    <h2 id="modalTitle"></h2>


    <div class="modal-info">

      <span id="modalViews"></span>

      <span id="modalDate"></span>

      <span id="modalCategory"></span>

    </div>


    <p id="modalText">
      Watch 3 ads to unlock this video.
    </p>


    <div class="progress">

      <span
        id="progressBar"
      ></span>

    </div>


    <div
      class="progress-text"
      id="progressText"
    >
      0 / 3 Ads Completed
    </div>


    <button
      class="watch-btn"
      id="watchAdBtn"
    >
      ▶ Watch Ad (0/3)
    </button>


    <button
      class="video-btn"
      id="videoBtn"
      disabled
    >
      🔒 Video Locked
    </button>

  </div>

</div>


<script src="app.js"></script>

</body>
</html>
