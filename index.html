<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Desi Girl Vairal Link</title>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Monetag SDK - KEEP THIS -->
  <script
    src="https://libtl.com/sdk.js"
    data-zone="11571866"
    data-sdk="show_11571866">
  </script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <!-- Header -->
    <header class="header">
      <div class="header-title">
        Desi Girl Vairal Link
      </div>

      <div id="tgUser" class="tg-user">
        Guest
      </div>
    </header>


    <!-- Posts -->
    <main id="videoGrid" class="video-grid">

      <div class="loading">
        Loading videos...
      </div>

    </main>


    <!-- Category navigation -->
    <nav class="bottom-tabs">

      <button class="tab active" data-category="All">
        All
      </button>

      <button class="tab" data-category="Trending">
        Trending
      </button>

      <button class="tab" data-category="Funny">
        Funny
      </button>

      <button class="tab" data-category="Popular">
        Popular
      </button>

    </nav>

  </div>


  <!-- Video Modal -->
  <div id="videoModal" class="video-modal hidden">

    <div class="video-modal-box">

      <button id="closeVideoModal" class="close-btn">
        ×
      </button>

      <h2 id="videoModalTitle">
        Video
      </h2>

      <video
        id="mainVideo"
        class="main-video"
        controls
        playsinline>
      </video>

    </div>

  </div>


  <script src="app.js"></script>

</body>
</html>
