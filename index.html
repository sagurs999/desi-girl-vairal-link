<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Desi Girl Viral Link</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Monetag SDK -->
  <script
    src="https://libtl.com/sdk.js"
    data-zone="11571866"
    data-sdk="show_11571866">
  </script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <header>
      <div>
        <div class="brand">Desi Girl Viral Link</div>
        <div class="sub">Trending Videos</div>
      </div>

      <div id="tgUser">Guest</div>
    </header>

    <div class="tabs">
      <button class="tab active" data-category="All">All</button>
      <button class="tab" data-category="Trending">Trending</button>
      <button class="tab" data-category="Funny">Funny</button>
      <button class="tab" data-category="Popular">Popular</button>
    </div>

    <main id="videoGrid"></main>

  </div>


  <div class="modal hidden" id="modal">

    <div class="modal-box">

      <button class="close-modal" id="closeModal">×</button>

      <div class="preview" id="preview"></div>

      <h2 id="modalTitle">Video</h2>

      <p id="modalText">
        Watch 3 ads to unlock this content.
      </p>

      <div class="progress">
        <span id="progressBar"></span>
      </div>

      <button class="watch-btn" id="watchAdBtn">
        Watch Ad (0/3)
      </button>

      <button class="video-btn" id="videoBtn" disabled>
        🔒 Video Locked
      </button>

    </div>

  </div>


  <script src="app.js"></script>

</body>
</html>
