<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Desi Girl Vairal Link</title>

  <!-- Telegram -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Monetag Rewarded Interstitial -->
  <script
    src="https://libtl.com/sdk.js"
    data-zone="11571866"
    data-sdk="show_11571866">
  </script>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <div class="app">


    <!-- ================= HEADER ================= -->

    <header class="top-header">

      <div class="brand-area">

        <div class="brand">
          🔐 Desi Girl Vairal Link
        </div>

        <div class="subtitle">
          Trending Videos
        </div>

      </div>


      <div class="earning-badge">
        online earning
      </div>

    </header>


    <!-- ================= VIDEO SECTION ================= -->

    <section class="videos-section">

      <div class="section-heading">

        <span class="section-icon">
          🔥
        </span>

        <span>
          Trending Videos
        </span>

      </div>


      <main
        id="videoGrid"
        class="video-grid"
      >

        <div class="loading">
          Loading videos...
        </div>

      </main>

    </section>


    <!-- ================= UNLOCK MODAL ================= -->

    <div
      id="modal"
      class="modal hidden"
    >

      <div class="modal-box">


        <button
          id="closeModal"
          class="modal-close"
          type="button"
        >
          ×
        </button>


        <div
          id="preview"
          class="modal-preview"
        >
          🎬
        </div>


        <h2
          id="modalTitle"
          class="modal-title"
        >
          Video
        </h2>


        <p
          id="modalText"
          class="modal-description"
        >
          Watch 3 ads to unlock this video.
        </p>


        <div class="ad-progress">

          <div
            id="progressBar"
            class="ad-progress-bar"
          ></div>

        </div>


        <div
          id="adCount"
          class="ad-count"
        >
          0 / 3 Ads Completed
        </div>


        <button
          id="watchAdBtn"
          class="watch-ad-btn"
          type="button"
        >
          🔒 Watch Ad
        </button>


        <button
          id="videoBtn"
          class="video-unlock-btn"
          type="button"
          disabled
        >
          🔒 Video Locked
        </button>

      </div>

    </div>


    <!-- ================= BOTTOM NAV ================= -->

    <nav class="bottom-nav">


      <button
        class="bottom-nav-btn bottom-active"
        type="button"
        data-category="All"
      >

        <span class="nav-icon">
          🏠
        </span>

        <span>
          All
        </span>

      </button>


      <button
        class="bottom-nav-btn"
        type="button"
        data-category="Trending"
      >

        <span class="nav-icon">
          🔥
        </span>

        <span>
          Trending
        </span>

      </button>


      <button
        class="bottom-nav-btn"
        type="button"
        data-category="Popular"
      >

        <span class="nav-icon">
          ⭐
        </span>

        <span>
          Popular
        </span>

      </button>


    </nav>

  </div>


  <script src="./app.js"></script>
</body>
</html>
