<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Desi Girl Vairal Link</title>

  <!-- Telegram -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Monetag SDK - KEEP THIS -->
  <script
    src="https://libtl.com/sdk.js"
    data-zone="11571866"
    data-sdk="show_11571866">
  </script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <!-- Header -->
    <header class="top-header">

      <div>
        <div class="brand">
          🔐 Desi Girl Vairal Link
        </div>

        <div class="subtitle">
          Trending Videos
        </div>
      </div>

      <div id="tgUser" class="tg-user">
        Guest
      </div>

    </header>


    <!-- Hero -->
    <section class="hero">

      <div class="hero-icon">
        🔓
      </div>

      <div>
        <h1>Telegram Mini App</h1>

        <p>
          Watch ads and unlock videos
        </p>
      </div>

    </section>


    <!-- Category -->
    <div class="category-bar">

      <button
        class="category-btn active"
        data-category="All">
        All
      </button>

      <button
        class="category-btn"
        data-category="Trending">
        Trending
      </button>

      <button
        class="category-btn"
        data-category="Popular">
        Popular
      </button>

      <button
        class="category-btn"
        data-category="Funny">
        Funny
      </button>

    </div>


    <!-- Section title -->
    <div class="section-title">

      <span class="section-badge">
        TRENDING
      </span>

      <span>
        Today's Videos 🔥
      </span>

    </div>


    <!-- Video Grid -->
    <main id="videoGrid" class="video-grid">

      <div class="loading">
        Loading videos...
      </div>

    </main>


    <!-- Bottom navigation -->
    <nav class="bottom-nav">

      <button class="bottom-active">
        🏠
        <span>All</span>
      </button>

      <button>
        🔥
        <span>Trending</span>
      </button>

      <button>
        ⭐
        <span>Popular</span>
      </button>

    </nav>

  </div>


  <script src="app.js"></script>

</body>
</html>
