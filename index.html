<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desi Girl Vairal Link</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Monetag Ad SDK -->
  <script src="https://libtl.com/sdk.js" data-zone="11571866" data-sdk="show_11571866"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #080d1d;
      color: #fff;
      padding: 15px;
    }
    .header {
      background: #171d39;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 15px;
    }
    .card {
      background: #1b2034;
      border-radius: 12px;
      padding: 10px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .thumb {
      width: 100%;
      height: 100px;
      background: #252d50;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      overflow: hidden;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .card h3 {
      font-size: 14px;
      margin: 10px 0 5px;
      height: 36px;
      overflow: hidden;
    }
    .btn {
      width: 100%;
      background: #3c5cf5;
      color: white;
      border: 0;
      padding: 8px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">
    <h2>🔐 Desi Girl Vairal Link</h2>
    <p style="font-size: 12px; color: #a0a8c7;">Watch ads to unlock videos</p>
  </div>

  <h3>Today's Videos 🔥</h3>
  <br>

  <div id="videoGrid" class="video-grid">
    <!-- Videos will load here -->
  </div>

  <script>
    // 1. Telegram WebApp Ready
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    // 2. Videos Array
    const allPosts = [
      {
        id: "0vascqz7njes",
        title: "Stepbrother 2023 - English Short Film",
        thumbnail_url: "https://img.doodcdn.io/snaps/0vascqz7njes.jpg"
      }
    ];

    // 3. Render Videos
    const videoGrid = document.getElementById("videoGrid");

    if (allPosts.length > 0) {
      videoGrid.innerHTML = allPosts.map(post => `
        <div class="card">
          <div class="thumb">
            ${post.thumbnail_url ? `<img src="${post.thumbnail_url}">` : '🎬'}
          </div>
          <h3>${post.title}</h3>
          <button class="btn" onclick="openVideo('${post.id}')">Watch Video</button>
        </div>
      `).join("");
    } else {
      videoGrid.innerHTML = "<p>No videos found</p>";
    }

    function openVideo(id) {
      window.location.href = `video.html?code=${id}`;
    }
  </script>
</body>
</html>
