<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://w.tads.me/widget.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desi Girl Vairal Link</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <div>
        <div class="brand">Desi Girl Vairal Link</div>
        <div class="sub">Trending videos</div>
      </div>
      <div class="tg-user" id="tgUser">Guest</div>
    </header>

    <div class="tabs">
      <button class="tab active" data-category="All">All</button>
      <button class="tab" data-category="Trending">Trending</button>
      <button class="tab" data-category="Funny">Funny</button>
      <button class="tab" data-category="Popular">Popular</button>
    </div>

    <main id="videoGrid"></main>
  </div>

  <div class="modal hidden" id="modal">
    <div class="modal-box">
      <button class="close" id="closeModal">×</button>
      <div class="preview" id="preview"></div>
      <h2 id="modalTitle"></h2>
      <p id="modalText">Watch 3 ads to unlock this content.</p>
      <div class="progress"><span id="progressBar"></span></div>
      <button class="watch-btn" id="watchAdBtn">Watch Ads (0/3)</button>
      <button class="video-btn" id="videoBtn" disabled>🔒 Video Locked</button>
    </div>
  </div>
<script>
document.addEventListener("DOMContentLoaded", function () {

    const WIDGET_ID = "11498";

    window.adController = window.tads.init({
        widgetId: WIDGET_ID,
        type: "fullscreen",
        debug: false,

        onShowReward: function (result) {
    console.log("Show ads, reward user:", result);

    adsWatched++;
    updateUnlock();

    watchAdBtn.disabled = false;
    watchAdBtn.textContent =
        `Watch Ads (${adsWatched}/${requiredAds})`;
},

        onAdsNotFound: function () {
    alert("TADS: এখন কোনো বিজ্ঞাপন পাওয়া যায়নি");
    console.log("No ad found");
},

    watchAdBtn.disabled = false;
    watchAdBtn.textContent =
        `Watch Ads (${adsWatched}/${requiredAds})`;
},
    });

    document.getElementById("watchAdBtn").addEventListener("click", function () {
        adController
            .showAd()
            .catch(function (result) {
                console.log(result);
            });
    });

});
</script>

<script src="app.js"></script>
</body>
</html>
