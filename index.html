<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Desi Girl Vairal Link</title>


  <!-- =====================================================
       TELEGRAM
  ====================================================== -->

  <script src="https://telegram.org/js/telegram-web-app.js"></script>


  <!-- =====================================================
       MONETAG IN-APP INTERSTITIAL
       
       IMPORTANT:
       This is SEPARATE from the 3 rewarded ads.

       2 ads
       0.1 hour = 6 minutes
       30 seconds interval
       5 seconds first delay
       session preserved
  ====================================================== -->

  <script
    src="https://libtl.com/sdk.js"
    data-zone="11571866"
    data-sdk="show_11571866"
    data-auto="2/0.1/30/5/0">
  </script>


  <!-- =====================================================
       CSS
  ====================================================== -->

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <div class="app">


    <!-- ===================================================
         HEADER
    ==================================================== -->

    <header class="top-header">

      <div>

        <div class="brand">
          🔐 Desi Girl Vairal Link
        </div>

        <div class="subtitle">
          Trending Videos
        </div>

      </div>


      <div
        id="tgUser"
        class="tg-user"
      >
        Guest
      </div>

    </header>


    <!-- ===================================================
         HERO
    ==================================================== -->

    <section class="hero">

      <div class="hero-icon">
        🔓
      </div>


      <div>

        <h1>
          Desi Girl Vairal Link
        </h1>

        <p>
          Watch ads and unlock videos
        </p>

      </div>

    </section>


    <!-- ===================================================
         CATEGORY
    ==================================================== -->

    <div class="category-bar">

      <button
        class="category-btn active"
        data-category="All"
        type="button"
      >
        All
      </button>


      <button
        class="category-btn"
        data-category="Trending"
        type="button"
      >
        Trending
      </button>


      <button
        class="category-btn"
        data-category="Popular"
        type="button"
      >
        Popular
      </button>


      <button
        class="category-btn"
        data-category="Hot video"
        type="button"
      >
        Hot video 🔥
      </button>

    </div>


    <!-- ===================================================
         SECTION TITLE
    ==================================================== -->

    <div class="section-title">

      <span class="section-badge">
        TRENDING
      </span>

      <span>
        Today's Videos 🔥
      </span>

    </div>


    <!-- ===================================================
         VIDEO GRID
    ==================================================== -->

    <main
      id="videoGrid"
      class="video-grid"
    >

      <div class="loading">
        Loading videos...
      </div>

    </main>


    <!-- ===================================================
         VIDEO UNLOCK MODAL
    ==================================================== -->

    <div
      id="modal"
      class="modal hidden"
    >

      <div class="modal-box">


        <!-- CLOSE -->

        <button
          id="closeModal"
          class="modal-close"
          type="button"
          aria-label="Close"
        >
          ×
        </button>


        <!-- THUMBNAIL -->

        <div
          id="preview"
          class="modal-preview"
        >
          🎬
        </div>


        <!-- TITLE -->

        <h2
          id="modalTitle"
          class="modal-title"
        >
          Video
        </h2>


        <!-- MESSAGE -->

        <p
          id="modalText"
          class="modal-description"
        >
          Watch 3 ads to unlock this video.
        </p>


        <!-- PROGRESS -->

        <div class="ad-progress">

          <div
            id="progressBar"
            class="ad-progress-bar"
          ></div>

        </div>


        <!-- COUNTER -->

        <div
          id="adCount"
          class="ad-count"
        >
          0 / 3 Ads Completed
        </div>


        <!-- REWARDED AD BUTTON -->

        <button
          id="watchAdBtn"
          class="watch-ad-btn"
          type="button"
        >
          ▶ Watch Ad (0/3)
        </button>


        <!-- VIDEO BUTTON -->

        <button
          id="videoBtn"
          class="video-unlock-btn"
          type="button"
          disabled
        >
          🔒 Video Locked
        </button>

      </div>

    </div>


    <!-- ===================================================
         BOTTOM NAV
    ==================================================== -->

    <nav class="bottom-nav">


      <button
        class="bottom-active"
        type="button"
        data-bottom-category="All"
      >
        🏠

        <span>
          All
        </span>

      </button>


      <button
        type="button"
        data-bottom-category="Trending"
      >
        🔥

        <span>
          Trending
        </span>

      </button>


      <button
        type="button"
        data-bottom-category="Popular"
      >
        ⭐

        <span>
          Popular
        </span>

      </button>


    </nav>

  </div>


  <!-- =====================================================
       APP JS
  ====================================================== -->

  <script src="app.js"></script>

</body>

</html>
