<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Desi Girl Vairal Link</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Monetag -->
  <script
    src="https://libtl.com/sdk.js"
    data-zone="11571866"
    data-sdk="show_11571866">
  </script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header class="top-header">

    <div>
      <div class="brand">
        🔐 Desi Girl Vairal Link
      </div>

      <div class="subtitle">
        Trending Videos
      </div>
    </div>

    <div id="tgUser" class="tg-user">
      Guest
    </div>

  </header>


  <!-- HERO -->
  <section class="hero">

    <div class="hero-icon">
      🔓
    </div>

    <div>
      <h1>Telegram Mini App</h1>

      <p>
        Watch ads and unlock videos
      </p>
    </div>

  </section>


  <!-- CATEGORY -->
  <div class="category-bar">

    <button
      class="category-btn active"
      data-category="All">
      All
    </button>

    <button
      class="category-btn"
      data-category="Trending">
      Trending
    </button>

    <button
      class="category-btn"
      data-category="Popular">
      Popular
    </button>

    <button
      class="category-btn"
      data-category="Funny">
      Funny
    </button>

  </div>


  <!-- SECTION -->
  <div class="section-title">

    <span class="section-badge">
      TRENDING
    </span>

    <span>
      Today's Videos 🔥
    </span>

  </div>


  <!-- VIDEOS -->
  <main
    id="videoGrid"
    class="video-grid">

    <div class="loading">
      Loading videos...
    </div>

  </main>


  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">

    <button
      class="bottom-active"
      data-category="All">

      🏠

      <span>
        All
      </span>

    </button>

    <button
      data-category="Trending">

      🔥

      <span>
        Trending
      </span>

    </button>

    <button
      data-category="Popular">

      ⭐

      <span>
        Popular
      </span>

    </button>

  </nav>

</div>


<!-- =====================================================
     VIDEO / AD MODAL
===================================================== -->

<div
  id="modal"
  class="modal hidden">

  <div class="modal-box">

    <button
      id="closeModal"
      class="close-modal">
      ✕
    </button>


    <div
      id="preview"
      class="preview">
      🎬
    </div>


    <h2 id="modalTitle">
      Video
    </h2>


    <p
      id="modalText"
      class="modal-text">
      Watch 3 ads to unlock this video.
    </p>


    <!-- PROGRESS -->
    <div class="progress-container">

      <div
        id="progressBar"
        class="progress-bar">
      </div>

    </div>


    <div
      id="adCounter"
      class="ad-counter">
      0 / 3 Ads Completed
    </div>


    <!-- AD BUTTON -->
    <button
      id="watchAdBtn"
      class="watch-ad-btn">

      ▶ Watch Ad (0/3)

    </button>


    <!-- VIDEO BUTTON -->
    <button
      id="videoBtn"
      class="video-btn"
      disabled>

      🔒 Video Locked

    </button>

  </div>

</div>


<script src="app.js"></script>

</body>
</html>
