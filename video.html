<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Watch Video</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000000;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: #ffffff;
    }

    /* Fullscreen Player Wrapper */
    .player-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
    }

    /* Floating Header Overlay */
    .player-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 14px 16px;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0) 100%);
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: none;
    }

    .player-header * {
      pointer-events: auto;
    }

    .back-btn {
      border: none;
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .back-btn:active {
      background: rgba(255, 255, 255, 0.35);
    }

    .video-title {
      font-size: 14px;
      font-weight: bold;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
    }

    .badge-unlocked {
      background: #00d084;
      color: #00261d;
      font-size: 10px;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 10px;
      text-transform: uppercase;
    }

    /* Video Player iframe & video */
    iframe, video {
      width: 100%;
      height: 100%;
      border: none;
      background: #000000;
    }

    /* Error Overlay */
    .overlay-msg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 50;
      width: 85%;
      max-width: 380px;
      text-align: center;
      padding: 20px;
      background: rgba(18, 22, 38, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    .overlay-msg h3 {
      font-size: 16px;
      color: #ff5c75;
      margin-bottom: 6px;
    }

    .overlay-msg p {
      font-size: 13px;
      color: #a0aec0;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="player-wrapper" id="playerArea">

    <!-- Header Overlay -->
    <div class="player-header">
      <button class="back-btn" onclick="goBack()" type="button">← Back</button>
      <div id="videoTitle" class="video-title">Watch Video</div>
      <span class="badge-unlocked">Unlocked</span>
    </div>

    <!-- Error Message Overlay -->
    <div id="errorOverlay" class="overlay-msg hidden">
      <h3>⚠️ ভিডিও পাওয়া যায়নি</h3>
      <p>ভিডিও আইডি বা লিংকটি অনুপস্থিত।</p>
    </div>

  </div>

  <script>
    /* Telegram WebApp Integration */
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.BackButton) {
        tg.BackButton.show();
        tg.BackButton.onClick(goBack);
      }
    }

    function goBack() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = 'index.html';
      }
    }

    /* URL Parameter Handlers */
    const params = new URLSearchParams(window.location.search);
    let rawVideo = params.get("url") || params.get("id");
    let customTitle = params.get("title");

    if (customTitle) {
      document.getElementById("videoTitle").textContent = decodeURIComponent(customTitle);
    }

    const playerArea = document.getElementById("playerArea");
    const errorOverlay = document.getElementById("errorOverlay");

    if (rawVideo) {
      let videoUrl = decodeURIComponent(rawVideo).trim();

      const isEmbed = 
        videoUrl.includes("lulustream") || 
        videoUrl.includes("dood") || 
        videoUrl.includes("playmogo") || 
        videoUrl.includes("streamwish") || 
        videoUrl.includes("/e/") || 
        videoUrl.includes("/d/") ||
        !videoUrl.includes(".");

      if (isEmbed) {
        // ১. যদি শুধু আইডি পাস করা হয়
        if (!videoUrl.startsWith("http://") && !videoUrl.startsWith("https://")) {
          videoUrl = `https://lulustream.com/e/${videoUrl}`;
        } 
        // ২. Lulustream লিংক অটো কনভার্ট
        else if (videoUrl.includes("lulustream.com")) {
          videoUrl = videoUrl.replace("/d/", "/e/");
          if (!videoUrl.includes("/e/")) {
            videoUrl = videoUrl.replace("lulustream.com/", "lulustream.com/e/");
          }
        }
        // ৩. Doodstream & Playmogo লিংক অটো কনভার্ট
        else if (videoUrl.includes("dood.to/d/")) {
          videoUrl = videoUrl.replace("dood.to/d/", "dood.to/e/");
        } else if (videoUrl.includes("playmogo.com/d/")) {
          videoUrl = videoUrl.replace("playmogo.com/d/", "playmogo.com/e/");
        }

        const iframe = document.createElement("iframe");
        iframe.src = videoUrl;
        iframe.allowFullscreen = true;
        iframe.setAttribute("allow", "autoplay; fullscreen");
        playerArea.appendChild(iframe);

      } else {
        // ডাইরেক্ট .mp4 ভিডিও প্লেয়ার
        const video = document.createElement("video");
        video.src = videoUrl;
        video.controls = true;
        video.autoplay = true;
        video.playsInline = true;
        playerArea.appendChild(video);
      }

    } else {
      errorOverlay.classList.remove("hidden");
      setTimeout(goBack, 2500);
    }
  </script>

</body>
</html>
