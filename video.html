<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening Video Player...</title>
  <style>
    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .loader {
      border: 4px solid #1e293b;
      border-top: 4px solid #6366f1;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h2 {
      font-size: 18px;
      margin-bottom: 8px;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="loader"></div>
  <h2>ভিডিও প্লেয়ারে রিডাইরেক্ট করা হচ্ছে...</h2>
  <p>অনুগ্রহ করে ১ সেকেন্ড অপেক্ষা করুন</p>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('id');

    if (videoId) {
      // Direct full-page player link
      window.location.href = `https://playmogo.com/e/${videoId}`;
    } else {
      document.querySelector('h2').textContent = "Video ID পাওয়া যায়নি!";
      document.querySelector('.loader').style.display = 'none';
    }
  </script>

</body>
</html>
