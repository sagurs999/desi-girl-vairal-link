<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Watch Video</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      min-height: 100%;
    }


    body {

      background:
        linear-gradient(
          180deg,
          #080c1c,
          #10162b,
          #070b17
        );

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

    }


    .page {

      width: 100%;

      max-width: 800px;

      margin: auto;

      padding: 18px;

    }


    .back {

      border: 0;

      background:
        linear-gradient(
          135deg,
          #405cff,
          #743cff
        );

      color: white;

      padding:
        12px 20px;

      border-radius:
        14px;

      font-size:
        15px;

      font-weight:
        900;

      cursor:
        pointer;

      margin-bottom:
        20px;

    }


    .card {

      background:
        linear-gradient(
          145deg,
          #191e35,
          #11172a
        );

      border:
        1px solid
        rgba(255,255,255,.1);

      border-radius:
        25px;

      padding:
        18px;

      box-shadow:
        0 20px 60px
        rgba(0,0,0,.35);

    }


    .badge {

      display:
        inline-block;

      padding:
        8px 14px;

      border-radius:
        20px;

      background:
        linear-gradient(
          135deg,
          #00d084,
          #00b9a5
        );

      color:
        #00271e;

      font-weight:
        900;

      font-size:
        13px;

      margin-bottom:
        13px;

    }


    h1 {

      font-size:
        24px;

      line-height:
        1.35;

      margin:
        5px 0 18px;

    }


    video {

      width:
        100%;

      display:
        block;

      background:
        #000;

      border-radius:
        18px;

      max-height:
        75vh;

    }


    .status {

      text-align:
        center;

      padding:
        35px 15px;

      color:
        #aeb7d2;

      line-height:
        1.6;

    }


    .success {

      color:
        #a9ffe3;

      background:
        rgba(0,208,132,.08);

      border:
        1px solid
        rgba(0,208,132,.15);

      border-radius:
        16px;

      margin-bottom:
        15px;

      padding:
        15px;

    }


    .error {

      color:
        #ffb2c3;

      background:
        rgba(255,60,100,.08);

      border:
        1px solid
        rgba(255,60,100,.15);

      border-radius:
        16px;

      padding:
        20px;

    }

  </style>

</head>


<body>


  <div class="page">


    <button
      class="back"
      type="button"
      onclick="goBack()"
    >
      ← Back
    </button>


    <div class="card">


      <div class="badge">
        🔓 VIDEO UNLOCKED
      </div>


      <h1 id="title">
        Loading...
      </h1>


      <div id="playerArea">

        <div class="status">
          Loading video...
        </div>

      </div>


    </div>

  </div>


  <script>

    /* =====================================================
       TELEGRAM
    ===================================================== */

    const tg =
      window.Telegram &&
      window.Telegram.WebApp;


    if (tg) {

      tg.ready();

      tg.expand();

    }


    /* =====================================================
       SUPABASE
    ===================================================== */

    const SUPABASE_URL =
      "https://mshoftgubfbkvynndtnu.supabase.co";


    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1zaG9mdGd1YmZia3Z5bm5kdG51Iiwicm9sIjoiYW5vbiIsImlhdCI6MTc4NjY0OTA5NCwiZXhwIjoyMTAyMjI1MDk0fQ.vcebPtNubpl8s34D-YsZ6jQwH93-MA0wgyDZBiO0Hi4";


    const params =
      new URLSearchParams(
        window.location.search
      );


    const postId =
      params.get("id");


    const title =
      document.getElementById(
        "title"
      );


    const playerArea =
      document.getElementById(
        "playerArea"
      );


    /* =====================================================
       BACK
    ===================================================== */

    function goBack() {

      if (
        window.history.length > 1
      ) {

        window.history.back();

      } else {

        window.location.href =
          "index.html";

      }

    }


    /* =====================================================
       LOAD VIDEO
    ===================================================== */

    async function loadVideo() {

      if (!postId) {

        showError(
          "Video ID missing."
        );

        return;

      }


      try {

        const url =
          `${SUPABASE_URL}/rest/v1/posts` +
          `?id=eq.${encodeURIComponent(postId)}` +
          `&published=eq.true` +
          `&select=id,title,video_url`;


        const response =
          await fetch(
            url,
            {

              method:
                "GET",

              headers:
                {

                  apikey:
                    SUPABASE_ANON_KEY,

                  Authorization:
                    `Bearer ${SUPABASE_ANON_KEY}`,

                  Accept:
                    "application/json"

                }

            }
          );


        if (!response.ok) {

          throw new Error(
            `Supabase ${response.status}: ${await response.text()}`
          );

        }


        const posts =
          await response.json();


        if (
          !Array.isArray(posts) ||
          !posts.length
        ) {

          showError(
            "Video post পাওয়া যায়নি অথবা post published নয়।"
          );

          return;

        }


        const post =
          posts[0];


        title.textContent =
          post.title ||
          "Video";


        if (
          !post.video_url
        ) {

          showError(
            "এই post-এর video_url দেওয়া নেই।"
          );

          return;

        }


        /* =================================================
           VIDEO PLAYER
        ================================================= */

        const video =
          document.createElement(
            "video"
          );


        video.controls =
          true;


        video.playsInline =
          true;


        video.preload =
          "metadata";


        video.setAttribute(
          "controlsList",
          "nodownload"
        );


        video.oncontextmenu =
          () => false;


        const source =
          document.createElement(
            "source"
          );


        source.src =
          post.video_url;


        source.type =
          "video/mp4";


        video.appendChild(
          source
        );


        playerArea.innerHTML = "";


        const success =
          document.createElement(
            "div"
          );


        success.className =
          "success";


        success.textContent =
          "🎉 Video unlocked. নিচের player থেকে ভিডিওটি দেখুন।";


        playerArea.appendChild(
          success
        );


        playerArea.appendChild(
          video
        );


        video.addEventListener(
          "error",
          () => {

            showError(
              "ভিডিও চালানো যাচ্ছে না। video_url অথবা Supabase Storage file check করুন।"
            );

          }
        );


      } catch (
        error
      ) {

        console.error(
          "VIDEO ERROR:",
          error
        );


        showError(
          error.message
        );

      }

    }


    /* =====================================================
       ERROR
    ===================================================== */

    function showError(
      message
    ) {

      playerArea.innerHTML = `

        <div class="error">

          ${escapeHTML(
            message
          )}

        </div>

      `;

    }


    /* =====================================================
       ESCAPE
    ===================================================== */

    function escapeHTML(
      value
    ) {

      return String(
        value ?? ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =====================================================
       START
    ===================================================== */

    loadVideo();

  </script>

</body>

</html>
