<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- HillTopAds Meta Tag -->
  <meta name="referrer" content="no-referrer-when-downgrade" />

  <title>Watch Video</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(135deg, #060817, #10162d, #061d28);
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }
    .page {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 18px;
    }
    .back {
      border: 0;
      background: linear-gradient(135deg, #405cff, #743cff);
      color: white;
      padding: 12px 20px;
      border-radius: 14px;
      cursor: pointer;
      margin-bottom: 22px;
      font-size: 15px;
      font-weight: 800;
    }
    .card {
      background: linear-gradient(145deg, rgba(31,37,62,.96), rgba(16,24,45,.96));
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 28px;
      padding: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    .badge {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 20px;
      background: linear-gradient(135deg, #00d084, #00c6c9);
      color: #00261d;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 14px;
    }

    /* VIDEO CONTAINER & FULLSCREEN FIX */
    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 18px;
      overflow: hidden;
      margin-top: 10px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* CUSTOM FULLSCREEN BUTTON */
    .fullscreen-btn {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
    }

    .fullscreen-btn:active {
      transform: scale(0.98);
    }

    /* BELOW PLAYER AD SPACE */
    .bottom-ad-space {
      margin-top: 20px;
      width: 100%;
      min-height: 120px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .status { text-align: center; padding: 35px 15px; color: #aeb6cf; }
    .error { color: #ff8b9d; background: rgba(255,60,100,.08); border-radius: 18px; padding: 20px; }
  </style>
</head>

<body>

  <div class="page">
    <button class="back" onclick="history.back()" type="button">← Back</button>

    <div class="card">
      <div class="badge">🔓 VIDEO UNLOCKED</div>

      <div id="playerArea">
        <div id="videoContainer" class="video-wrapper">
          <iframe 
            id="videoIframe" 
            src="" 
            allow="fullscreen; autoplay; encrypted-media; picture-in-picture" 
            allowfullscreen="true"
            webkitallowfullscreen="true"
            mozallowfullscreen="true">
          </iframe>
        </div>

        <!-- 100% WORKING FULLSCREEN TRIGGER BUTTON -->
        <button id="fsBtn" class="fullscreen-btn" type="button">
          📺 Click For Fullscreen Video
        </button>
      </div>

      <!-- ================= AD BELOW PLAYER ================= -->
      <div class="bottom-ad-space">
        <!-- আপনার HillTopAds / Monetag বা অন্য প্লেসমেন্ট কোড এখানে বসাতে পারেন -->
      </div>

    </div>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const params = new URLSearchParams(window.location.search);
    const videoId = params.get("id");
    const iframe = document.getElementById("videoIframe");
    const videoContainer = document.getElementById("videoContainer");
    const fsBtn = document.getElementById("fsBtn");

    if (videoId) {
      iframe.src = `https://playmogo.com/e/${videoId}`;
    } else {
      document.getElementById("playerArea").innerHTML = `
        <div class="status error">
          Video ID missing or invalid.
        </div>
      `;
    }

    /* FULLSCREEN API IMPLEMENTATION FOR TELEGRAM / MOBILE BROWSER */
    fsBtn.addEventListener("click", () => {
      if (videoContainer.requestFullscreen) {
        videoContainer.requestFullscreen();
      } else if (videoContainer.webkitRequestFullscreen) { /* Safari / iOS */
        videoContainer.webkitRequestFullscreen();
      } else if (videoContainer.msRequestFullscreen) { /* IE/Edge */
        videoContainer.msRequestFullscreen();
      } else if (iframe.webkitEnterFullscreen) {
        iframe.webkitEnterFullscreen();
      } else {
        alert("Fullscreen mode is not supported on this webview.");
      }
    });
  </script>

</body>

</html>
