<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d18"><title>Video</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#090d18;color:#fff;font-family:Arial,sans-serif}.top{padding:16px;background:#090d18;position:sticky;top:0}.back{border:0;color:#fff;background:linear-gradient(135deg,#4263ff,#7147ff);border-radius:14px;padding:11px 15px;font-weight:700}.wrap{max-width:760px;margin:auto;padding:12px 16px 35px}.hero{border-radius:24px;padding:22px 18px;background:linear-gradient(135deg,#4169ff,#7147ff 55%,#00bfa6);margin-bottom:18px}.badge{display:inline-block;padding:7px 11px;border-radius:99px;background:#ffffff2b;font-size:12px;font-weight:800}.hero h1{margin:12px 0 6px;font-size:25px}.sub{opacity:.85}.player{border-radius:22px;overflow:hidden;background:#000}.player video{display:block;width:100%;max-height:72vh;background:#000}.info{margin-top:16px;padding:18px;border-radius:20px;background:#ffffff0d}.info h2{margin:0 0 8px}.info p{margin:0;color:#b9c0d4;line-height:1.5}.error{display:none;margin-top:15px;padding:14px;border-radius:14px;background:#4a1624;color:#ffd0d0;line-height:1.5}</style></head><body><div class="top"><button class="back" id="back">← Back</button></div><main class="wrap"><section class="hero"><span class="badge">🔓 VIDEO UNLOCKED</span><h1 id="title">Video</h1><div class="sub">Desi Girl Viral Link</div></section><section class="player"><video id="player" controls playsinline preload="metadata"></video></section><section class="info"><h2 id="infoTitle">Watch Video</h2><p>আপনি সফলভাবে ভিডিওটি আনলক করেছেন। নিচের প্লেয়ার থেকে ভিডিওটি দেখতে পারবেন।</p></section><div id="error" class="error"></div></main><script>const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}const p=new URLSearchParams(location.search),t=p.get("title")||"Video",v=p.get("video")||"",thumb=p.get("thumb")||"";document.title=t;document.getElementById("title").textContent=t;document.getElementById("infoTitle").textContent=t;const player=document.getElementById("player"),err=document.getElementById("error");if(thumb)player.poster=thumb;if(v){player.src=v;player.load()}else{err.style.display="block";err.textContent="ভিডিও URL পাওয়া যায়নি। আগের পেজ থেকে video_url পাঠানো হয়নি।"}player.onerror=()=>{err.style.display="block";err.textContent="ভিডিও চালানো যাচ্ছে না। Supabase video_url এবং Storage access চেক করুন।"};document.getElementById("back").onclick=()=>{if(history.length>1)history.back();else location.href="index.html"}</script></body></html>
