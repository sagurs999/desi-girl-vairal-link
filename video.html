<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Watch Video</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

<header class="header">

  <button
    class="back-btn"
    onclick="goBack()"
  >
    ←
  </button>


  <div>

    <div class="brand">
      🔐 Desi Girl Vairal Link
    </div>

    <div class="subtitle">
      Video Player
    </div>

  </div>

</header>


<main class="watch-page">


  <div id="videoLoading" class="loading">

    <div class="spinner"></div>

    <p>
      Loading player...
    </p>

  </div>


  <div
    id="videoError"
    class="error-box hidden"
  >

    <h3>
      ⚠️ Video unavailable
    </h3>

    <p id="videoErrorText">
      Unable to load video.
    </p>

  </div>


  <div
    id="playerContainer"
    class="player-container hidden"
  >

    <iframe
      id="doodPlayer"
      allowfullscreen
      frameborder="0"
      scrolling="no"
      allow="autoplay; fullscreen"
    ></iframe>

  </div>


  <div class="watch-info">

    <h1 id="videoTitle">
      Loading...
    </h1>

    <p>
      Desi Girl Vairal Link
    </p>

  </div>


</main>


<script>

"use strict";


const tg =
  window.Telegram?.WebApp;


if (tg) {

  tg.ready();

  tg.expand();

}


const params =
  new URLSearchParams(
    window.location.search
  );


const fileCode =
  params.get("id");


const loading =
  document.getElementById(
    "videoLoading"
  );


const errorBox =
  document.getElementById(
    "videoError"
  );


const errorText =
  document.getElementById(
    "videoErrorText"
  );


const playerContainer =
  document.getElementById(
    "playerContainer"
  );


const player =
  document.getElementById(
    "doodPlayer"
  );


/*
  Check file code
*/

if (!fileCode) {

  showError(
    "Video ID is missing."
  );

} else {

  /*
    Check unlock
  */

  const unlocked =
    sessionStorage.getItem(
      `video_unlocked_${fileCode}`
    );


  if (unlocked !== "1") {

    showError(
      "This video is locked. Please unlock it first."
    );

  } else {

    loadPlayer();

  }

}


/* =========================================================
   PLAYER
========================================================= */

function loadPlayer() {

  try {

    /*
      DoodStream embed
    */

    player.src =
      `https://dood.watch/e/${
        encodeURIComponent(fileCode)
      }`;


    player.onload =
      () => {

        loading.classList.add(
          "hidden"
        );

        playerContainer.classList.remove(
          "hidden"
        );

      };


    /*
      Show player even if browser
      doesn't fire iframe load.
    */

    setTimeout(
      () => {

        loading.classList.add(
          "hidden"
        );

        playerContainer.classList.remove(
          "hidden"
        );

      },
      2500
    );


  } catch (error) {

    showError(
      error.message
    );

  }

}


/* =========================================================
   ERROR
========================================================= */

function showError(message) {

  loading.classList.add(
    "hidden"
  );

  playerContainer.classList.add(
    "hidden"
  );

  errorBox.classList.remove(
    "hidden"
  );

  errorText.textContent =
    message;

}


/* =========================================================
   BACK
========================================================= */

function goBack() {

  if (
    window.history.length > 1
  ) {

    window.history.back();

  } else {

    window.location.href =
      "index.html";

  }

}

</script>

</body>

</html>
