<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Video Player</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #0f172a;
      color: #fff;
      font-family: sans-serif;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    .back-btn {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 15px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .status-badge {
      background-color: #10b981;
      color: #fff;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 10px;
    }

    .player-card {
      background: #1e293b;
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .player-wrapper {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
      height: 0;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
      margin-top: 15px;
    }

    .player-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <button class="back-btn" onclick="window.location.href='index.html'">← Back</button>

    <div class="player-card">
      <span class="status-badge">🔒 VIDEO UNLOCKED</span>
      <h2 id="videoTitle" style="margin: 10px 0; font-size: 18px;">Loading Video...</h2>

      <!-- FULLSCREEN SUPPORTED IFRAME -->
      <div class="player-wrapper">
        <iframe 
          id="videoIframe"
          src="" 
          allowfullscreen="true"
          webkitallowfullscreen="true"
          mozallowfullscreen="true"
          allow="autoplay; fullscreen; picture-in-picture; accelerometer; gyroscope"
          sandbox="allow-forms allow-scripts allow-same-origin allow-popups">
        </iframe>
      </div>
    </div>
  </div>

  <script>
    // URL থেকে ID সংগ্রহ করা
    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('id');

    if (videoId) {
      const iframe = document.getElementById('videoIframe');
      iframe.src = `https://playmogo.com/e/${videoId}`;
    } else {
      document.getElementById('videoTitle').textContent = "Video Not Found";
    }
  </script>
</body>
</html>
