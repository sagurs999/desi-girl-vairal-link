<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Video</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Monetag SDK -->
  <script src="https://libtl.com/sdk.js" data-zone="11571866" data-sdk="show_11571866"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #060817, #10162d, #061d28);
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    .page {
      width: 100%;
      max-width: 800px;
      margin: auto;
      padding: 18px;
    }

    .back {
      border: 0;
      background: linear-gradient(135deg, #405cff, #743cff);
      color: white;
      padding: 12px 20px;
      border-radius: 14px;
      cursor: pointer;
      margin-bottom: 22px;
      font-size: 15px;
      font-weight: 800;
      box-shadow: 0 8px 25px rgba(80, 70, 255, 0.25);
    }

    .card {
      background: linear-gradient(145deg, rgba(31, 37, 62, 0.96), rgba(16, 24, 45, 0.96));
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 18px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(15px);
    }

    .badge {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 20px;
      background: linear-gradient(135deg, #00d084, #00c6c9);
      color: #00261d;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 24px;
      line-height: 1.3;
      margin: 6px 0 18px;
    }

    video, iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      display: block;
      border-radius: 18px;
      border: 0;
      background: #000;
    }

    .status {
      text-align: center;
      padding: 35px 15px;
      color: #aeb6cf;
      line-height: 1.6;
    }

    .error {
      color: #ff8b9d;
      background: rgba(255, 60, 100, 0.08);
      border: 1px solid rgba(255, 80, 120, 0.15);
      border-radius: 18px;
    }

    .success {
      color: #a9ffe3;
      background: rgba(0, 208, 132, 0.08);
      border: 1px solid rgba(0, 208, 132, 0.15);
      border-radius: 18px;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

  <div class="page">

    <button class="back" onclick="history.back()" type="button">
      ← Back
    </button>

    <div class="card">

      <div class="badge">
        🔓 VIDEO UNLOCKED
      </div>

      <h1 id="title">
        Loading...
      </h1>

      <div id="playerArea">
        <div class="status">
          Loading video...
        </div>
      </div>

    </div>

  </div>

  <script>
    /* TELEGRAM WEBAPP */
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    /* SUPABASE CONFIGURATION */
    const SUPABASE_URL = "https://mshoftgubfbkvynndtnu.supabase.co";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

    /* GET PARAMETERS */
    const params = new URLSearchParams(window.location.search);
    const postId = params.get("id");

    /* DOM ELEMENTS */
    const title = document.getElementById("title");
    const playerArea = document.getElementById("playerArea");

    /* LOAD VIDEO FUNCTION */
    async function loadVideo() {

      if (!postId) {
        showError("Video ID is missing.");
        return;
      }

      try {
        const url = `${SUPABASE_URL}/rest/v1/posts?id=eq.${encodeURIComponent(postId)}&select=id,title,video_url`;

        const response = await fetch(url, {
          method: "GET",
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: `Bearer ${SUPABASE_ANON_KEY}`
          }
        });

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(`Supabase ${response.status}: ${errorText}`);
        }

        const posts = await response.json();

        if (!posts || posts.length === 0) {
          showError("Video post not found.");
          return;
        }

        const post = posts[0];

        // Title Set
        title.textContent = post.title || "Video";

        // Video URL Check
        const videoUrl = post.video_url || "";

        if (!videoUrl) {
          showError("Video URL not found in video_url column.");
          return;
        }

        playerArea.innerHTML = "";

        // Success Message
        const success = document.createElement("div");
        success.className = "status success";
        success.textContent = "আপনি সফলভাবে ভিডিওটি আনলক করেছেন। নিচের player থেকে ভিডিওটি দেখতে পারবেন।";
        playerArea.appendChild(success);

        // Doodstream & Embed Link Check
        const isEmbed = videoUrl.includes("/e/") || videoUrl.includes("dood") || videoUrl.includes("dso");

        if (isEmbed) {
          // Iframe Player for Doodstream
          const iframe = document.createElement("iframe");
          iframe.src = videoUrl;
          iframe.setAttribute("allowfullscreen", "true");
          iframe.setAttribute("scrolling", "no");
          playerArea.appendChild(iframe);
        } else {
          // Standard HTML5 MP4 Player
          const video = document.createElement("video");
          video.controls = true;
          video.playsInline = true;
          video.preload = "metadata";
          video.setAttribute("controlsList", "nodownload");
          video.setAttribute("oncontextmenu", "return false;");

          const source = document.createElement("source");
          source.src = videoUrl;
          source.type = "video/mp4";

          video.appendChild(source);
          playerArea.appendChild(video);

          video.addEventListener("error", () => {
            showError("ভিডিওটি চালানো যাচ্ছে না। video_url অথবা ভিডিও ফাইলটি পরীক্ষা করুন।");
          });
        }

      } catch (error) {
        console.error("Video loading error:", error);
        showError(`Unable to load video: ${error.message}`);
      }
    }

    /* ERROR HANDLER */
    function showError(message) {
      playerArea.innerHTML = `
        <div class="status error">
          ${escapeHTML(message)}
        </div>
      `;
    }

    /* ESCAPE HTML */
    function escapeHTML(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // START
    loadVideo();
  </script>

</body>

</html>
