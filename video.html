<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#10131c"
  >

  <title>Watch Video</title>


  <!-- Telegram Mini App -->

  <script src="https://telegram.org/js/telegram-web-app.js"></script>


  <!-- Appwrite -->

  <script src="https://cdn.jsdelivr.net/npm/appwrite@latest"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      background:
        linear-gradient(
          135deg,
          #141e30,
          #243b55,
          #2c5364
        );
      color: #ffffff;
    }


    body {
      min-height: 100vh;
      padding: 20px;
    }


    .container {
      width: 100%;
      max-width: 950px;
      margin: 0 auto;
    }


    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 20px;
    }


    .back-btn {
      border: 0;
      outline: 0;
      cursor: pointer;

      padding: 11px 18px;

      border-radius: 12px;

      background:
        rgba(255,255,255,.12);

      color: #ffffff;

      font-size: 15px;

      backdrop-filter: blur(10px);
    }


    .page-title {
      margin: 0;

      font-size: 20px;

      font-weight: 700;

      text-align: center;

      flex: 1;
    }


    .video-wrapper {

      width: 100%;

      background: #000000;

      border-radius: 20px;

      overflow: hidden;

      box-shadow:
        0 15px 45px
        rgba(0,0,0,.35);

    }


    #videoContainer {
      width: 100%;
      background: #000;
    }


    #videoContainer video {

      display: block;

      width: 100%;

      height: auto;

      max-height: 80vh;

      background: #000;

    }


    .loading {

      min-height: 280px;

      display: flex;

      align-items: center;

      justify-content: center;

      flex-direction: column;

      gap: 15px;

      color: rgba(255,255,255,.8);

    }


    .spinner {

      width: 45px;

      height: 45px;

      border: 4px solid
        rgba(255,255,255,.15);

      border-top-color:
        #ffffff;

      border-radius: 50%;

      animation:
        spin .8s linear infinite;

    }


    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }


    .error-box {

      padding: 35px 20px;

      text-align: center;

      background:
        rgba(255,70,70,.08);

      color: #ffb3b3;

    }


    .error-icon {

      font-size: 45px;

      margin-bottom: 15px;

    }


    .video-info {

      margin-top: 18px;

      padding: 20px;

      border-radius: 18px;

      background:
        rgba(255,255,255,.09);

      backdrop-filter: blur(12px);

    }


    .video-info h1 {

      margin: 0 0 10px;

      font-size: 23px;

      line-height: 1.35;

    }


    .video-info p {

      margin: 0;

      color:
        rgba(255,255,255,.7);

      line-height: 1.6;

    }


    .locked-box {

      min-height: 300px;

      padding: 30px;

      display: flex;

      align-items: center;

      justify-content: center;

      text-align: center;

      flex-direction: column;

      gap: 15px;

      background: #101010;

    }


    .locked-icon {

      font-size: 55px;

    }


    .locked-title {

      font-size: 22px;

      font-weight: 700;

    }


    .locked-text {

      max-width: 500px;

      color:
        rgba(255,255,255,.7);

      line-height: 1.6;

    }


    .back-main {

      margin-top: 18px;

      display: inline-block;

      text-decoration: none;

      color: #ffffff;

      padding: 12px 20px;

      border-radius: 12px;

      background:
        rgba(255,255,255,.12);

    }


    @media (max-width: 600px) {

      body {
        padding: 10px;
      }

      .video-wrapper {
        border-radius: 14px;
      }

      .video-info {
        padding: 15px;
      }

      .video-info h1 {
        font-size: 19px;
      }

    }

  </style>

</head>


<body>


  <div class="container">


    <div class="top-bar">

      <button
        class="back-btn"
        id="backBtn"
        type="button"
      >
        ← Back
      </button>


      <h2
        class="page-title"
        id="topTitle"
      >
        Video
      </h2>

    </div>


    <div class="video-wrapper">

      <div id="videoContainer">

        <div class="loading">

          <div class="spinner"></div>

          <div>
            Loading video...
          </div>

        </div>

      </div>

    </div>


    <div class="video-info">

      <h1 id="title">
        Loading...
      </h1>

      <p id="description">
        Please wait...
      </p>

    </div>


  </div>


  <script>

    /* ======================================================
       TELEGRAM
       ====================================================== */

    const tg =
      window.Telegram?.WebApp ||
      null;


    if (tg) {

      tg.ready();

      tg.expand();

    }


    /* ======================================================
       APPWRITE CONFIG
       ====================================================== */

    const APPWRITE_ENDPOINT =
      "https://cloud.appwrite.io/v1";


    const APPWRITE_PROJECT_ID =
      "6a953702002468f915bf";


    const APPWRITE_DATABASE_ID =
      "6a97f8710010ad20905d";


    const APPWRITE_TABLE_ID =
      "6a97fa98002d5e65d0f4";


    const APPWRITE_BUCKET_ID =
      "6a9539820022110c710";


    /* ======================================================
       APPWRITE
       ====================================================== */

    const client =
      new Appwrite.Client();


    client
      .setEndpoint(
        APPWRITE_ENDPOINT
      )
      .setProject(
        APPWRITE_PROJECT_ID
      );


    const tablesDB =
      new Appwrite.TablesDB(
        client
      );


    /* ======================================================
       DOM
       ====================================================== */

    const videoContainer =
      document.getElementById(
        "videoContainer"
      );


    const title =
      document.getElementById(
        "title"
      );


    const topTitle =
      document.getElementById(
        "topTitle"
      );


    const description =
      document.getElementById(
        "description"
      );


    const backBtn =
      document.getElementById(
        "backBtn"
      );


    /* ======================================================
       URL PARAMETER
       ====================================================== */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const postId =
      params.get("id");


    /* ======================================================
       UNLOCK KEY
       ====================================================== */

    function getUnlockKey(
      videoId
    ) {

      return `video_unlocked_${videoId}`;

    }


    /* ======================================================
       CHECK 3-AD UNLOCK
       ====================================================== */

    function isUnlocked() {

      if (!postId) {
        return false;
      }

      return (
        sessionStorage.getItem(
          getUnlockKey(postId)
        ) === "true"
      );

    }


    /* ======================================================
       APPWRITE VIDEO URL
       ====================================================== */

    function buildAppwriteVideoUrl(
      fileId
    ) {

      if (!fileId) {
        return "";
      }


      return (
        `${APPWRITE_ENDPOINT}` +
        `/storage/buckets/` +
        `${encodeURIComponent(APPWRITE_BUCKET_ID)}` +
        `/files/` +
        `${encodeURIComponent(fileId)}` +
        `/view?project=` +
        `${encodeURIComponent(APPWRITE_PROJECT_ID)}`
      );

    }


    /* ======================================================
       NORMALIZE VIDEO URL
       ====================================================== */

    function normalizeVideoUrl(
      value
    ) {

      if (!value) {
        return "";
      }


      const raw =
        String(value).trim();


      if (!raw) {
        return "";
      }


      /*
       * যদি videoUrl-এ শুধু File ID থাকে
       */

      if (
        !raw.startsWith("http://") &&
        !raw.startsWith("https://")
      ) {

        return buildAppwriteVideoUrl(
          raw
        );

      }


      /*
       * Full Appwrite URL
       */

      try {

        const url =
          new URL(raw);


        /*
         * admin parameter remove
         */

        url.searchParams.delete(
          "mode"
        );


        /*
         * project missing হলে add
         */

        if (
          !url.searchParams.get(
            "project"
          )
        ) {

          url.searchParams.set(
            "project",
            APPWRITE_PROJECT_ID
          );

        }


        return url.toString();

      } catch (error) {

        console.error(
          "Invalid video URL:",
          error
        );

        return raw;

      }

    }


    /* ======================================================
       SHOW ERROR
       ====================================================== */

    function showError(
      message
    ) {

      videoContainer.innerHTML = `

        <div class="error-box">

          <div class="error-icon">
            ⚠️
          </div>

          <div>
            ${escapeHTML(message)}
          </div>

        </div>

      `;

    }


    /* ======================================================
       HTML ESCAPE
       ====================================================== */

    function escapeHTML(
      value
    ) {

      return String(value ?? "")
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* ======================================================
       SHOW LOCKED
       ====================================================== */

    function showLocked() {

      videoContainer.innerHTML = `

        <div class="locked-box">

          <div class="locked-icon">
            🔒
          </div>

          <div class="locked-title">
            Video Locked
          </div>

          <div class="locked-text">
            এই ভিডিও দেখতে আগে মূল পেজে গিয়ে
            ৩টি বিজ্ঞাপন সম্পূর্ণ করতে হবে।
          </div>

          <a
            class="back-main"
            href="index.html"
          >
            ← Go Back
          </a>

        </div>

      `;


      title.textContent =
        "Video Locked";


      topTitle.textContent =
        "Locked";


      description.textContent =
        "Complete 3 ads to unlock this video.";

    }


    /* ======================================================
       LOAD VIDEO
       ====================================================== */

    async function loadVideo() {


      /*
       * ID না থাকলে
       */

      if (!postId) {

        showError(
          "Video ID পাওয়া যায়নি।"
        );

        return;

      }


      /*
       * 3 ads completed কিনা
       */

      if (!isUnlocked()) {

        showLocked();

        return;

      }


      try {

        console.log(
          "Loading row:",
          postId
        );


        /*
         * Appwrite row
         */

        const post =
          await tablesDB.getRow({

            databaseId:
              APPWRITE_DATABASE_ID,

            tableId:
              APPWRITE_TABLE_ID,

            rowId:
              postId

          });


        console.log(
          "Appwrite post:",
          post
        );


        /*
         * Title
         */

        const videoTitle =
          post.title ||
          "Video";


        title.textContent =
          videoTitle;


        topTitle.textContent =
          videoTitle;


        description.textContent =
          "Now playing";


        /*
         * IMPORTANT:
         *
         * আপনার Appwrite field হলো videoUrl
         */

        let rawVideoUrl =
          post.videoUrl ??
          post.video_url ??
          "";


        /*
         * URL তৈরি/clean
         */

        const videoUrl =
          normalizeVideoUrl(
            rawVideoUrl
          );


        console.log(
          "Raw video URL:",
          rawVideoUrl
        );


        console.log(
          "Final video URL:",
          videoUrl
        );


        /*
         * URL না থাকলে
         */

        if (!videoUrl) {

          showError(
            "এই পোস্টে videoUrl পাওয়া যায়নি।"
          );

          return;

        }


        /*
         * Video element
         */

        const video =
          document.createElement(
            "video"
          );


        video.controls =
          true;


        video.playsInline =
          true;


        video.preload =
          "metadata";


        video.setAttribute(
          "controlsList",
          "nodownload"
        );


        video.style.width =
          "100%";


        video.style.display =
          "block";


        video.style.background =
          "#000";


        /*
         * Source
         */

        const source =
          document.createElement(
            "source"
          );


        source.src =
          videoUrl;


        source.type =
          "video/mp4";


        video.appendChild(
          source
        );


        /*
         * Clear loading
         */

        videoContainer.innerHTML =
          "";


        videoContainer.appendChild(
          video
        );


        /*
         * Video error
         */

        video.addEventListener(
          "error",
          () => {

            console.error(
              "HTML video error:",
              video.error
            );


            showError(
              "ভিডিওটি browser-এ load করা যাচ্ছে না। Appwrite Storage URL বা video format চেক করুন।"
            );

          }
        );


        /*
         * Can play
         */

        video.addEventListener(
          "canplay",
          () => {

            console.log(
              "Video can play."
            );

          }
        );


        /*
         * Metadata
         */

        video.addEventListener(
          "loadedmetadata",
          () => {

            console.log(
              "Video metadata loaded."
            );

          }
        );


        /*
         * Load
         */

        video.load();


      } catch (error) {

        console.error(
          "Video loading error:",
          error
        );


        showError(
          "Appwrite থেকে ভিডিও তথ্য পাওয়া যাচ্ছে না। Table Read permission চেক করুন।"
        );

      }

    }


    /* ======================================================
       BACK BUTTON
       ====================================================== */

    backBtn.addEventListener(
      "click",
      () => {

        if (
          window.history.length > 1
        ) {

          window.history.back();

        } else {

          window.location.href =
            "index.html";

        }

      }
    );


    /* ======================================================
       START
       ====================================================== */

    loadVideo();

  </script>

</body>

</html>
