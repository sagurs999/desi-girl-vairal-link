<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Video Player</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#fff;background:radial-gradient(circle at 10% 0%,rgba(72,92,255,.35),transparent 35%),radial-gradient(circle at 90% 20%,rgba(0,220,190,.18),transparent 30%),#090d18}.top{padding:16px;position:sticky;top:0;z-index:5;background:rgba(9,13,24,.88);backdrop-filter:blur(14px)}button{border:0;color:#fff;background:linear-gradient(135deg,#4263ff,#7147ff);border-radius:14px;padding:11px 15px;font-weight:700;font-size:15px}.wrap{padding:12px 16px 35px}.hero{border-radius:24px;padding:22px 18px;background:linear-gradient(135deg,#4169ff,#7147ff 55%,#00bfa6);box-shadow:0 18px 45px rgba(40,75,255,.25);margin-bottom:18px}.badge{display:inline-block;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.18);font-size:12px;font-weight:800}.hero h1{margin:12px 0 6px;font-size:25px}.sub{opacity:.86;font-size:14px}.player{overflow:hidden;border-radius:22px;background:#000;box-shadow:0 18px 45px rgba(0,0,0,.45)}video{display:block;width:100%;max-height:72vh;background:#000}.info{margin-top:16px;padding:18px;border-radius:20px;background:rgba(255,255,255,.07)}.info h2{margin:0 0 8px}.info p{margin:0;color:#b9c0d4;line-height:1.55}.error{display:none;margin-top:15px;padding:14px;border-radius:14px;background:rgba(255,70,70,.12);color:#ffd0d0}
</style>
</head>
<body>
<div class="top"><button id="backBtn">← Back</button></div>
<main class="wrap">
<section class="hero"><span class="badge">🔓 VIDEO UNLOCKED</span><h1 id="title">Video</h1><div class="sub">Desi Girl Viral Link</div></section>
<section class="player"><video id="videoPlayer" controls playsinline preload="metadata" poster=""></video></section>
<div class="info"><h2 id="infoTitle">Watch Video</h2><p>আপনি সফলভাবে ভিডিওটি আনলক করেছেন। নিচের প্লেয়ার থেকে ভিডিওটি দেখতে পারবেন।</p></div>
<div class="error" id="errorBox">ভিডিও URL পাওয়া যায়নি। আগের পেজ থেকে সঠিক ভিডিও লিংক দিয়ে আবার চেষ্টা করুন।</div>
</main>
<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}
const p=new URLSearchParams(location.search),title=p.get("title")||"Video",videoUrl=p.get("video")||"",thumbUrl=p.get("thumb")||"";
document.title=title+" - Desi Girl Viral Link";
document.getElementById("title").textContent=title;
document.getElementById("infoTitle").textContent=title;
const player=document.getElementById("videoPlayer");
if(thumbUrl)player.poster=thumbUrl;
if(videoUrl){player.src=videoUrl;player.load()}else document.getElementById("errorBox").style.display="block";
document.getElementById("backBtn").onclick=()=>{if(history.length>1)history.back();else if(tg)tg.close();else location.href="index.html"};
</script>
</body>
</html>
