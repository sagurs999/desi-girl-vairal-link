<body>
<div class="container">

    🚀 JOIN TELEGRAM CHANNEL
  </a>

  <div class="video-info" id="videoTitle">Loading Video...</div>

  <div class="player">
    <iframe id="videoFrame" src="" allowfullscreen scrolling="no"></iframe>

    <div class="overlay-ad" id="middleAd">
      YOUR_MIDDLE_AD_CODE
    </div>
  </div>

<script>
/* app.js বা পোস্ট থেকে পাঠানো ভিডিও আইডি ও টাইটেল রিসিভ করার লজিক */
const urlParams = new URLSearchParams(window.location.search);
const videoId = urlParams.get('id');
const videoTitleParam = urlParams.get('title');

const videoFrame = document.getElementById("videoFrame");
const videoTitle = document.getElementById("videoTitle");

function loadCurrentVideo() {
  if (!videoId) {
    videoTitle.textContent = "Video not found!";
    return;
  }

  // সরাসরি পোস্ট বা app.js থেকে আসা আইডি অনুযায়ী প্লেয়ারে ভিডিও লোড করবে
  videoFrame.src = `https://playmogo.com/e/${videoId}`;

  if (videoTitleParam) {
    videoTitle.textContent = decodeURIComponent(videoTitleParam);
  } else {
    videoTitle.textContent = "Vairal Video";
  }
}

loadCurrentVideo();
</script>
