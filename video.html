<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta

<header class="header">

<!-- ================= MAIN ================= -->

<main class="watch-page">

    <div
        id="videoLoading"
        class="loading">

            Loading video...
        </p>

    </div>



    <!-- Error -->

    <div
        id="videoError"
        class="error-box hidden">

        <div class="error-icon">
            ⚠️
        </div>

        <h3>
            Video unavailable
        </h3>

        <p id="videoErrorText">

        </p>


        <button
            onclick="goBack()">
            ← Go Back
        </button>

    </div>



    <!-- ================= VIDEO PLAYER ================= -->

    <div
        id="playerContainer"
        class="player-container hidden">

        <iframe
            id="doodPlayer"
            src=""
            allowfullscreen
            frameborder="0"
            scrolling="no"
            allow="autoplay; fullscreen">
        </iframe>

    </div>



    <!-- ================= VIDEO INFO ================= -->

    <section class="watch-info">

        <h1 id="videoTitle">
            Loading...
        </h1>


        <div class="watch-meta">

            <span>
                🎬 DoodStream
            </span>

            <span>
                🔐 Unlocked
            </span>

        </div>


        <p>
            Enjoy watching the video.
        </p>

    </section>


</main>



<!-- ================= BOTTOM NAV ================= -->

<nav class="bottom-nav">

    <button
        class="nav-item"
        onclick="goHome()">

        <span>🏠</span>

        <small>
            Home
        </small>

    </button>


    <button
        class="nav-item"
        onclick="goBack()">

        <small>
            Back
        </small>

    </button>

</nav>
