<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- HillTopAds Meta Tag -->
  <meta name="referrer" content="no-referrer-when-downgrade" />

  <title>Watch Video</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(135deg, #060817, #10162d, #061d28);
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }
    .page {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 18px;
    }
    .back {
      border: 0;
      background: linear-gradient(135deg, #405cff, #743cff);
      color: white;
      padding: 12px 20px;
      border-radius: 14px;
      cursor: pointer;
      margin-bottom: 22px;
      font-size: 15px;
      font-weight: 800;
    }
    .card {
      background: linear-gradient(145deg, rgba(31,37,62,.96), rgba(16,24,45,.96));
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 28px;
      padding: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    .badge {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 20px;
      background: linear-gradient(135deg, #00d084, #00c6c9);
      color: #00261d;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 14px;
    }

    /* VIDEO CONTAINER & OVERLAY */
    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 18px;
      overflow: hidden;
      margin-top: 10px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* CUSTOM OVERLAY TO BLOCK PLAYER ADS & FIX FULLSCREEN */
    .player-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 99;
    }

    .play-btn-custom {
      width: 75px;
      height: 75px;
      background: #ff0055;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: #fff;
      box-shadow: 0 0 30px rgba(255, 0, 85, 0.8);
      transition: transform 0.2s ease;
    }

    .player-overlay:hover .play-btn-custom {
      transform: scale(1.1);
    }

    .play-text {
      margin-top: 10px;
      font-size: 14px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.8);
      padding: 6px 16px;
      border-radius: 20px;
    }

    /* HILLTOPADS CONTAINER BELOW VIDEO */
    .hilltop-ad-box {
      margin-top: 25px;
      padding: 15px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed rgba(255, 255, 255, 0.2);
      border-radius: 18px;
      text-align: center;
      min-height: 260px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .ad-title {
      font-size: 11px;
      color: #7b88a8;
      margin-bottom: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .status { text-align: center; padding: 35px 15px; color: #aeb6cf; }
    .error { color: #ff8b9d; background: rgba(255,60,100,.08); border-radius: 18px; padding: 20px; }
  </style>
</head>

<body>

  <div class="page">
    <button class="back" onclick="history.back()" type="button">← Back</button>

    <div class="card">
      <div class="badge">🔓 VIDEO UNLOCKED</div>

      <div id="playerArea">
        <div id="videoContainer" class="video-wrapper">
          <iframe 
            id="videoIframe" 
            src="" 
            allow="fullscreen; autoplay; encrypted-media; picture-in-picture" 
            allowfullscreen="true">
          </iframe>

          <!-- OVERLAY FOR FULLSCREEN & PREVENTING PLAYER ADS -->
          <div id="playerOverlay" class="player-overlay">
            <div class="play-btn-custom">▶</div>
            <div class="play-text">Click To Play In Fullscreen ⛶</div>
          </div>
        </div>
      </div>

      <!-- ================= HILLTOPADS AREA BELOW VIDEO ================= -->
      <div class="hilltop-ad-box">
        <div class="ad-title">Sponsored Content</div>
        
        <div id="hilltop-ad-container">
          <!-- HillTopAds Script (আপনার ড্যাশবোর্ড থেকে পাওয়া ব্যানার অ্যাড কোড এখানে বসাবেন) -->
        </div>
      </div>

    </div>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const params = new URLSearchParams(window.location.search);
    const videoId = params.get("id");
    const iframe = document.getElementById("videoIframe");
    const videoContainer = document.getElementById("videoContainer");
    const playerOverlay = document.getElementById("playerOverlay");

    if (videoId) {
      iframe.src = `https://playmogo.com/e/${videoId}`;
    } else {
      document.getElementById("playerArea").innerHTML = `
        <div class="status error">Video ID missing or invalid.</div>
      `;
    }

    /* FULLSCREEN CLICK HANDLER */
    playerOverlay.addEventListener("click", () => {
      playerOverlay.style.display = "none";

      if (videoContainer.requestFullscreen) {
        videoContainer.requestFullscreen();
      } else if (videoContainer.webkitRequestFullscreen) {
        videoContainer.webkitRequestFullscreen();
      } else if (videoContainer.msRequestFullscreen) {
        videoContainer.msRequestFullscreen();
      } else if (iframe.webkitEnterFullscreen) {
        iframe.webkitEnterFullscreen();
      }
    });

    document.addEventListener("fullscreenchange", () => {
      if (!document.fullscreenElement) {
        playerOverlay.style.display = "flex";
      }
    });
  </script>

</body>

</html>
