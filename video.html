<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Watch Video</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      background:
        linear-gradient(
          135deg,
          #060817,
          #10162d,
          #061d28
        );

      color: white;

      font-family:
        Arial,
        sans-serif;

      min-height:
        100vh;
    }


    .page {

      width: 100%;

      max-width: 900px;

      margin: auto;

      padding: 18px;
    }


    .back {

      border: 0;

      background:
        linear-gradient(
          135deg,
          #405cff,
          #743cff
        );

      color: white;

      padding:
        12px 20px;

      border-radius:
        14px;

      cursor:
        pointer;

      margin-bottom:
        22px;

      font-size:
        15px;

      font-weight:
        800;

      box-shadow:
        0 8px 25px
        rgba(80,70,255,.25);
    }


    .card {

      background:
        linear-gradient(
          145deg,
          rgba(31,37,62,.96),
          rgba(16,24,45,.96)
        );

      border:
        1px solid
        rgba(255,255,255,.12);

      border-radius:
        28px;

      padding:
        18px;

      box-shadow:
        0 20px 60px
        rgba(0,0,0,.35);

      backdrop-filter:
        blur(15px);
    }


    .badge {

      display:
        inline-block;

      padding:
        8px 14px;

      border-radius:
        20px;

      background:
        linear-gradient(
          135deg,
          #00d084,
          #00c6c9
        );

      color:
        #00261d;

      font-weight:
        bold;

      font-size:
        13px;

      margin-bottom:
        14px;
    }


    h1 {

      font-size:
        24px;

      line-height:
        1.3;

      margin:
        6px 0 18px;
    }


    /* Doodstream Wrapper */
    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 18px;
      overflow: hidden;
      margin-top: 10px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }


    .status {

      text-align:
        center;

      padding:
        35px 15px;

      color:
        #aeb6cf;

      line-height:
        1.6;
    }


    .error {

      color:
        #ff8b9d;

      background:
        rgba(255,60,100,.08);

      border:
        1px solid
        rgba(255,80,120,.15);

      border-radius:
        18px;
    }


    .success {

      color:
        #a9ffe3;

      background:
        rgba(0,208,132,.08);

      border:
        1px solid
        rgba(0,208,132,.15);

      border-radius:
        18px;

      margin-bottom:
        15px;
    }

  </style>

</head>


<body>

  <div class="page">


    <button
      class="back"
      onclick="history.back()"
      type="button"
    >
      ← Back
    </button>


    <div class="card">


      <div class="badge">
        🔓 VIDEO UNLOCKED
      </div>


      <h1 id="title">
        Watch Video
      </h1>


      <div id="playerArea">

        <div class="status">
          Loading video...
        </div>

      </div>


    </div>

  </div>


  <script>

    /* =====================================================
       TELEGRAM
    ===================================================== */

    const tg =
      window.Telegram &&
      window.Telegram.WebApp;


    if (tg) {

      tg.ready();

      tg.expand();

    }


    /* =====================================================
       URL PARAMETER
    ===================================================== */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const postId =
      params.get("id");


    /* =====================================================
       DOM
    ===================================================== */

    const playerArea =
      document.getElementById(
        "playerArea"
      );


    /* =====================================================
       LOAD DOODSTREAM VIDEO
    ===================================================== */

    function loadVideo() {


      if (!postId) {

        showError(
          "Video ID is missing."
        );

        return;

      }


      try {

        playerArea.innerHTML = "";


        const success =
          document.createElement(
            "div"
          );


        success.className =
          "status success";


        success.textContent =
          "আপনি সফলভাবে ভিডিওটি আনলক করেছেন। নিচের player থেকে ভিডিওটি দেখতে পারবেন।";


        const wrapper =
          document.createElement(
            "div"
          );

        wrapper.className =
          "video-wrapper";


        const iframe =
          document.createElement(
            "iframe"
          );


        // Doodstream / Playmogo URL
        iframe.src =
          `https://playmogo.com/e/${encodeURIComponent(postId)}`;


        iframe.allow =
          "fullscreen; autoplay; encrypted-media; picture-in-picture";


        iframe.allowFullscreen =
          true;


        wrapper.appendChild(
          iframe
        );


        playerArea.appendChild(
          success
        );


        playerArea.appendChild(
          wrapper
        );


      } catch (
        error
      ) {

        console.error(
          "Video loading error:",
          error
        );


        showError(
          `Unable to load video: ${error.message}`
        );

      }

    }


    /* =====================================================
       ERROR
    ===================================================== */

    function showError(
      message
    ) {

      playerArea.innerHTML = `

        <div class="status error">

          ${escapeHTML(
            message
          )}

        </div>

      `;

    }


    /* =====================================================
       ESCAPE HTML
    ===================================================== */

    function escapeHTML(
      value
    ) {

      return String(
        value
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =====================================================
       START
    ===================================================== */

    loadVideo();

  </script>

</body>

</html>
