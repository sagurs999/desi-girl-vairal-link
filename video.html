<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Watch Video</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      min-height: 100vh;

      background:
        linear-gradient(
          135deg,
          #080d1d,
          #10162c,
          #06182a
        );

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }


    .page {
      width: 100%;

      max-width: 800px;

      margin: auto;

      padding: 22px;
    }


    .back {
      border: 0;

      background:
        linear-gradient(
          135deg,
          #405cff,
          #743dff
        );

      color: white;

      padding:
        12px 20px;

      border-radius: 14px;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      margin-bottom: 28px;
    }


    .card {
      background:
        rgba(255,255,255,.08);

      border:
        1px solid
        rgba(255,255,255,.12);

      border-radius: 25px;

      padding: 20px;

      backdrop-filter:
        blur(15px);

      box-shadow:
        0 20px 60px
        rgba(0,0,0,.25);
    }


    .badge {
      display: inline-block;

      padding:
        9px 15px;

      border-radius: 25px;

      background:
        linear-gradient(
          135deg,
          #00b894,
          #00cec9
        );

      color:
        #00251e;

      font-weight: 900;

      font-size: 14px;

      margin-bottom: 18px;
    }


    h1 {
      font-size: 28px;

      margin:
        0 0 18px;
    }


    video {
      width: 100%;

      display: block;

      border-radius: 18px;

      background: #000;

      max-height: 75vh;
    }


    .status {
      text-align: center;

      padding:
        40px 15px;

      color: #b7bfd5;

      line-height: 1.6;
    }


    .error {
      color:
        #ff8a9b;

      background:
        rgba(255,50,80,.10);

      border-radius: 18px;
    }

  </style>

</head>


<body>

<div class="page">

  <button
    class="back"
    onclick="history.back()">

    ← Back

  </button>


  <div class="card">

    <div class="badge">
      🔓 VIDEO UNLOCKED
    </div>


    <h1 id="title">
      Loading...
    </h1>


    <div id="playerArea">

      <div class="status">
        Loading video...
      </div>

    </div>

  </div>

</div>


<script>

/* =========================================================
   TELEGRAM
========================================================= */

const tg =
  window.Telegram &&
  window.Telegram.WebApp;

if (tg) {

  tg.ready();

  tg.expand();

}


/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://mshoftgubfbkvynndtnu.supabase.co";

const SUPABASE_ANON_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1zaG9mdGd1YmZia3Z5bm5kdG51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NDkwOTQsImV4cCI6MjEwMjIyNTA5NH0.vcebPtNubpl8s34D-YsZ6jQwH93-MA0wgyDZBiO0Hi4";


/* =========================================================
   GET ID
========================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const postId =
  params.get("id");


/* =========================================================
   DOM
========================================================= */

const title =
  document.getElementById(
    "title"
  );

const playerArea =
  document.getElementById(
    "playerArea"
  );


/* =========================================================
   LOAD VIDEO
========================================================= */

async function loadVideo() {

  if (!postId) {

    showError(
      "Video ID is missing."
    );

    return;

  }


  try {

    /*
      IMPORTANT:
      We query the post by ID.
    */

    const url =
      `${SUPABASE_URL}/rest/v1/posts` +
      `?id=eq.${encodeURIComponent(postId)}` +
      `&select=*`;


    const response =
      await fetch(
        url,
        {
          method: "GET",

          headers: {

            apikey:
              SUPABASE_ANON_KEY,

            Authorization:
              `Bearer ${SUPABASE_ANON_KEY}`

          }

        }
      );


    if (!response.ok) {

      const errorText =
        await response.text();

      throw new Error(
        `Supabase ${response.status}: ${errorText}`
      );

    }


    const posts =
      await response.json();


    if (!posts.length) {

      showError(
        "Video post not found."
      );

      return;

    }


    const post =
      posts[0];


    title.textContent =
      post.title ||
      "Video";


    /*
      IMPORTANT:
      ONLY video_url

      No post.video
    */

    const videoUrl =
      post.video_url ||
      "";


    if (!videoUrl) {

      showError(
        "Video URL not found in video_url column."
      );

      return;

    }


    /*
      Check URL
    */

    console.log(
      "Video URL:",
      videoUrl
    );


    /* =====================================================
       VIDEO PLAYER
    ===================================================== */

    const video =
      document.createElement(
        "video"
      );


    video.controls =
      true;

    video.playsInline =
      true;

    video.preload =
      "metadata";

    video.setAttribute(
      "controlsList",
      "nodownload"
    );


    const source =
      document.createElement(
        "source"
      );


    source.src =
      videoUrl;

    source.type =
      "video/mp4";


    video.appendChild(
      source
    );


    playerArea.innerHTML =
      "";

    playerArea.appendChild(
      video
    );


    /*
      Video loading error
    */

    video.addEventListener(
      "error",
      () => {

        showError(
          "Video file could not be played. Please check the Supabase video URL."
        );

      }
    );


  } catch (error) {

    console.error(
      "VIDEO ERROR:",
      error
    );


    showError(
      `Unable to load video: ${error.message}`
    );

  }

}


/* =========================================================
   ERROR
========================================================= */

function showError(message) {

  playerArea.innerHTML = `

    <div class="status error">

      ${escapeHTML(message)}

    </div>

  `;

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   START
========================================================= */

loadVideo();

</script>

</body>
</html>
