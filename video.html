<!DOCTYPE html>
<html lang="en">

<head>

  <title>Watch Video</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(135deg, #060817, #10162d, #061d28);
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }
    .page {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 18px;
    }
    .back {
      border: 0;
      background: linear-gradient(135deg, #405cff, #743cff);
      color: white;
      padding: 12px 20px;
      border-radius: 14px;
      cursor: pointer;
      margin-bottom: 22px;
      font-size: 15px;
      font-weight: 800;
    }
    .card {
      background: linear-gradient(145deg, rgba(31,37,62,.96), rgba(16,24,45,.96));
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 28px;
      padding: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    .badge {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 20px;
      background: linear-gradient(135deg, #00d084, #00c6c9);
      color: #00261d;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 14px;
    }

    /* CLEAN VIDEO CONTAINER */
    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 18px;
      overflow: hidden;
      margin-top: 10px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .status { text-align: center; padding: 35px 15px; color: #aeb6cf; }
    .error { color: #ff8b9d; background: rgba(255,60,100,.08); border-radius: 18px; padding: 20px; }
  </style>
</head>

<body>

  <div class="page">
    <button class="back" onclick="history.back()" type="button">← Back</button>

    <div class="card">
      <div class="badge">🔓 VIDEO UNLOCKED</div>

      <div id="playerArea">
        <div id="videoContainer" class="video-wrapper">
          <iframe 
            id="videoIframe" 
            src="" 
            allow="fullscreen; autoplay; encrypted-media; picture-in-picture" 
            allowfullscreen="true">
          </iframe>
        </div>
      </div>

    </div>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const params = new URLSearchParams(window.location.search);
    const videoId = params.get("id");
    const iframe = document.getElementById("videoIframe");

    if (videoId) {
      iframe.src = `https://playmogo.com/e/${videoId}`;
    } else {
      document.getElementById("playerArea").innerHTML = `
        <div class="status error">Video ID missing or invalid.</div>
      `;
    }
  </script>

</body>

</html>
