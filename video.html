<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Watch Video</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    .main-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      padding: 10px;
    }
    .video-container {
      width: 100%;
      max-width: 900px;
      aspect-ratio: 16/9;
      background: #111;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .back-btn {
      margin-top: 15px;
      padding: 10px 22px;
      background: #3c5cf5;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      display: inline-block;
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <div class="video-container">
      <!-- Fullscreen Support Attributes -->
      <iframe 
        id="videoIframe" 
        src="" 
        allow="fullscreen; autoplay; encrypted-media; picture-in-picture" 
        allowfullscreen="true"
        webkitallowfullscreen="true"
        mozallowfullscreen="true">
      </iframe>
    </div>

    <a href="index.html" class="back-btn">⬅ Back to Home</a>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const videoCode = urlParams.get('code');

    if (videoCode) {
      document.getElementById('videoIframe').src = `https://playmogo.com/e/${videoCode}`;
    } else {
      document.querySelector('.main-wrapper').innerHTML = "<h2>Video code not found!</h2><a href='index.html' class='back-btn'>Go Back</a>";
    }
  </script>
</body>
</html>
