<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Video</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #0b0f19;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .video-container {
      width: 100%;
      max-width: 600px;
    }
    .back-btn {
      background-color: #6366f1;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 20px;
      display: inline-block;
    }
    .player-card {
      background-color: #151d30;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .badge {
      background-color: #10b981;
      color: white;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 10px;
    }
    .iframe-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      margin-top: 10px;
    }
    .iframe-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .info-box {
      background-color: #1e293b;
      border-radius: 8px;
      padding: 12px;
      margin: 15px 0;
      text-align: center;
      font-size: 14px;
      color: #cbd5e1;
    }
  </style>
</head>
<body>

  <div class="video-container">
    <button class="back-btn" onclick="window.location.href='index.html'">← Back</button>

    <div class="player-card">
      <span class="badge">🔓 VIDEO UNLOCKED</span>
      <h2 id="videoTitle" style="margin: 10px 0; font-size: 18px;">Loading...</h2>

      <div class="info-box">
        আপনি সফলভাবে ভিডিওটি আনলক করেছেন।<br>নিচে প্লেয়ার থেকে ভিডিওটি দেখুন।
      </div>

      <div class="iframe-container">
        <iframe id="player" src="" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('id');

    if (videoId) {
      document.getElementById('player').src = `https://playmogo.com/e/${videoId}`;
    } else {
      document.getElementById('videoTitle').textContent = "Video ID missing!";
    }
  </script>

</body>
</html>
