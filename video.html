<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Watch Video</title>


  <!-- Telegram -->

  <script src="https://telegram.org/js/telegram-web-app.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      background:
        linear-gradient(
          135deg,
          #060817,
          #10162d,
          #061d28
        );

      color: white;

      font-family:
        Arial,
        sans-serif;

      min-height:
        100vh;
    }


    .page {

      width: 100%;

      max-width: 800px;

      margin: auto;

      padding: 18px;
    }


    .back {

      border: 0;

      background:
        linear-gradient(
          135deg,
          #405cff,
          #743cff
        );

      color: white;

      padding:
        12px 20px;

      border-radius:
        14px;

      cursor:
        pointer;

      margin-bottom:
        22px;

      font-size:
        15px;

      font-weight:
        800;
    }


    .card {

      background:
        linear-gradient(
          145deg,
          rgba(31,37,62,.96),
          rgba(16,24,45,.96)
        );

      border:
        1px solid
        rgba(255,255,255,.12);

      border-radius:
        28px;

      padding:
        18px;

      box-shadow:
        0 20px 60px
        rgba(0,0,0,.35);
    }


    .badge {

      display:
        inline-block;

      padding:
        8px 14px;

      border-radius:
        20px;

      background:
        linear-gradient(
          135deg,
          #00d084,
          #00c6c9
        );

      color:
        #00261d;

      font-weight:
        bold;

      font-size:
        13px;

      margin-bottom:
        14px;
    }


    h1 {

      font-size:
        24px;

      line-height:
        1.3;

      margin:
        6px 0 18px;
    }


    .video-info {

      display:
        flex;

      gap:
        10px;

      flex-wrap:
        wrap;

      margin-bottom:
        18px;

      color:
        #aeb6cf;

      font-size:
        13px;
    }


    .info-item {

      padding:
        7px 10px;

      border-radius:
        12px;

      background:
        rgba(255,255,255,.06);

      border:
        1px solid
        rgba(255,255,255,.06);
    }


    video {

      width:
        100%;

      display:
        block;

      border-radius:
        18px;

      background:
        #000;

      max-height:
        75vh;
    }


    .status {

      text-align:
        center;

      padding:
        35px 15px;

      color:
        #aeb6cf;

      line-height:
        1.6;
    }


    .error {

      color:
        #ff8b9d;

      background:
        rgba(255,60,100,.08);

      border:
        1px solid
        rgba(255,80,120,.15);

      border-radius:
        18px;
    }


    .success {

      color:
        #a9ffe3;

      background:
        rgba(0,208,132,.08);

      border:
        1px solid
        rgba(0,208,132,.15);

      border-radius:
        18px;

      margin-bottom:
        15px;

      padding:
        14px;
    }

  </style>

</head>


<body>

  <div class="page">


    <button
      class="back"
      onclick="goBack()"
      type="button"
    >
      ← Back
    </button>


    <div class="card">


      <div class="badge">
        🔓 VIDEO UNLOCKED
      </div>


      <h1 id="title">
        Loading...
      </h1>


      <div
        id="videoInfo"
        class="video-info"
      >
      </div>


      <div id="playerArea">

        <div class="status">
          Loading video...
        </div>

      </div>


    </div>

  </div>


  <script>

    /* =====================================================
       TELEGRAM
    ===================================================== */

    const tg =
      window.Telegram &&
      window.Telegram.WebApp;


    if (tg) {

      tg.ready();

      tg.expand();

    }


    /* =====================================================
       SUPABASE
    ===================================================== */

    const SUPABASE_URL =
      "https://mshoftgubfbkvynndtnu.supabase.co";


    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1zaG9mdGd1YmZia3Z5bm5kdG51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NDkwOTQsImV4cCI6MjEwMjIyNTA5NH0.vcebPtNubpl8s34D-YsZ6jQwH93-MA0wgyDZBiO0Hi4";


    /* =====================================================
       URL
    ===================================================== */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const postId =
      params.get("id");


    /* =====================================================
       DOM
    ===================================================== */

    const title =
      document.getElementById(
        "title"
      );


    const playerArea =
      document.getElementById(
        "playerArea"
      );


    const videoInfo =
      document.getElementById(
        "videoInfo"
      );


    /* =====================================================
       BACK
    ===================================================== */

    function goBack() {

      if (
        window.history.length > 1
      ) {

        window.history.back();

      } else {

        window.location.href =
          "index.html";

      }

    }


    /* =====================================================
       DATE
    ===================================================== */

    function formatDate(
      value
    ) {

      if (!value) {
        return "Unknown";
      }


      const date =
        new Date(value);


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {

        return "Unknown";

      }


      return date.toLocaleDateString(
        "en-CA"
      );

    }


    /* =====================================================
       LOAD VIDEO
    ===================================================== */

    async function loadVideo() {

      if (!postId) {

        showError(
          "Video ID is missing."
        );

        return;

      }


      try {

        const url =
          `${SUPABASE_URL}/rest/v1/posts` +
          `?id=eq.${encodeURIComponent(postId)}` +
          `&select=id,title,category,video_url,created_at`;


        const response =
          await fetch(
            url,
            {

              method:
                "GET",

              headers:
                {

                  apikey:
                    SUPABASE_ANON_KEY,

                  Authorization:
                    `Bearer ${SUPABASE_ANON_KEY}`,

                  "Content-Type":
                    "application/json"

                }

            }
          );


        if (!response.ok) {

          const errorText =
            await response.text();

          throw new Error(
            `Supabase ${response.status}: ${errorText}`
          );

        }


        const posts =
          await response.json();


        if (
          !posts.length
        ) {

          showError(
            "Video post not found."
          );

          return;

        }


        const post =
          posts[0];


        /* =================================================
           TITLE
        ================================================= */

        title.textContent =
          post.title ||
          "Video";


        /* =================================================
           INFO
        ================================================= */

        videoInfo.innerHTML = `

          <div class="info-item">
            📅 ${escapeHTML(
              formatDate(
                post.created_at
              )
            )}
          </div>

          <div class="info-item">
            📁 ${escapeHTML(
              post.category ||
              "Video"
            )}
          </div>

        `;


        /* =================================================
           VIDEO URL
        ================================================= */

        const videoUrl =
          post.video_url ||
          "";


        if (!videoUrl) {

          showError(
            "Video URL not found in video_url column."
          );

          return;

        }


        /* =================================================
           PLAYER
        ================================================= */

        const video =
          document.createElement(
            "video"
          );


        video.controls =
          true;


        video.playsInline =
          true;


        video.preload =
          "metadata";


        video.setAttribute(
          "controlsList",
          "nodownload"
        );


        video.setAttribute(
          "disablePictureInPicture",
          ""
        );


        video.oncontextmenu =
          () => false;


        const source =
          document.createElement(
            "source"
          );


        source.src =
          videoUrl;


        source.type =
          "video/mp4";


        video.appendChild(
          source
        );


        playerArea.innerHTML =
          "";


        const success =
          document.createElement(
            "div"
          );


        success.className =
          "success";


        success.textContent =
          "✅ ভিডিওটি আনলক হয়েছে। এখন ভিডিওটি দেখতে পারবেন।";


        playerArea.appendChild(
          success
        );


        playerArea.appendChild(
          video
        );


        /* =================================================
           RECORD VIEW
        ================================================= */

        await recordView(
          String(
            post.id
          )
        );


        /* =================================================
           VIDEO ERROR
        ================================================= */

        video.addEventListener(
          "error",
          () => {

            showError(
              "ভিডিওটি চালানো যাচ্ছে না। video_url অথবা ভিডিও ফাইলটি পরীক্ষা করুন।"
            );

          }
        );


      } catch (error) {

        console.error(
          "Video loading error:",
          error
        );


        showError(
          `Unable to load video: ${error.message}`
        );

      }

    }


    /* =====================================================
       RECORD VIEW
    ===================================================== */

    async function recordView(
      id
    ) {

      try {

        let viewerKey =
          null;


        /*
          Telegram user ID থাকলে
          সেটি ব্যবহার হবে।
        */

        if (
          tg &&
          tg.initDataUnsafe &&
          tg.initDataUnsafe.user &&
          tg.initDataUnsafe.user.id
        ) {

          viewerKey =
            `tg_${tg.initDataUnsafe.user.id}`;

        }


        /*
          Telegram ID না থাকলে
          browser-এর জন্য anonymous key।
        */

        if (!viewerKey) {

          viewerKey =
            localStorage.getItem(
              "desi_girl_viewer_key"
            );


          if (!viewerKey) {

            viewerKey =
              "web_" +
              crypto.randomUUID();


            localStorage.setItem(
              "desi_girl_viewer_key",
              viewerKey
            );

          }

        }


        const response =
          await fetch(
            `${SUPABASE_URL}/rest/v1/rpc/record_post_view`,
            {

              method:
                "POST",

              headers: {

                apikey:
                  SUPABASE_ANON_KEY,

                Authorization:
                  `Bearer ${SUPABASE_ANON_KEY}`,

                "Content-Type":
                  "application/json"

              },

              body:
                JSON.stringify({

                  p_post_id:
                    String(id),

                  p_viewer_key:
                    viewerKey

                })

            }
          );


        if (!response.ok) {

          console.error(
            "View recording failed:",
            await response.text()
          );

          return;

        }


        const result =
          await response.json();


        console.log(
          "View recorded:",
          result
        );


      } catch (error) {

        /*
          View recording fail করলেও
          video বন্ধ হবে না।
        */

        console.error(
          "View tracking error:",
          error
        );

      }

    }


    /* =====================================================
       ERROR
    ===================================================== */

    function showError(
      message
    ) {

      playerArea.innerHTML = `

        <div class="status error">

          ${escapeHTML(
            message
          )}

        </div>

      `;

    }


    /* =====================================================
       ESCAPE HTML
    ===================================================== */

    function escapeHTML(
      value
    ) {

      return String(
        value
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =====================================================
       START
    ===================================================== */

    loadVideo();

  </script>

</body>

</html>
