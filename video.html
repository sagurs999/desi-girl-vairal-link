<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Watch Video</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      background:
        linear-gradient(
          135deg,
          #060817,
          #10162d,
          #061d28
        );

      color: white;

      font-family:
        Arial,
        sans-serif;

      min-height:
        100vh;
    }


    .page {

      width: 100%;

      max-width: 800px;

      margin: auto;

      padding: 18px;
    }


    .back {

      border: 0;

      background:
        linear-gradient(
          135deg,
          #405cff,
          #743cff
        );

      color: white;

      padding:
        12px 20px;

      border-radius:
        14px;

      cursor:
        pointer;

      margin-bottom:
        22px;

      font-size:
        15px;

      font-weight:
        800;

      box-shadow:
        0 8px 25px
        rgba(80,70,255,.25);
    }


    .card {

      background:
        linear-gradient(
          145deg,
          rgba(31,37,62,.96),
          rgba(16,24,45,.96)
        );

      border:
        1px solid
        rgba(255,255,255,.12);

      border-radius:
        28px;

      padding:
        18px;

      box-shadow:
        0 20px 60px
        rgba(0,0,0,.35);

      backdrop-filter:
        blur(15px);
    }


    .badge {

      display:
        inline-block;

      padding:
        8px 14px;

      border-radius:
        20px;

      background:
        linear-gradient(
          135deg,
          #00d084,
          #00c6c9
        );

      color:
        #00261d;

      font-weight:
        bold;

      font-size:
        13px;

      margin-bottom:
        14px;
    }


    h1 {

      font-size:
        24px;

      line-height:
        1.3;

      margin:
        6px 0 18px;
    }


    video, iframe {

      width:
        100%;

      display:
        block;

      border:
        none;

      border-radius:
        18px;

      background:
        #000;

      min-height:
        250px;

      height:
        55vh;

      max-height:
        75vh;
    }


    .status {

      text-align:
        center;

      padding:
        35px 15px;

      color:
        #aeb6cf;

      line-height:
        1.6;
    }


    .error {

      color:
        #ff8b9d;

      background:
        rgba(255,60,100,.08);

      border:
        1px solid
        rgba(255,80,120,.15);

      border-radius:
        18px;
    }


    .success {

      color:
        #a9ffe3;

      background:
        rgba(0,208,132,.08);

      border:
        1px solid
        rgba(0,208,132,.15);

      border-radius:
        18px;

      margin-bottom:
        15px;
    }

  </style>

</head>


<body>

  <div class="page">


    <button
      class="back"
      onclick="history.back()"
      type="button"
    >
      ← Back
    </button>


    <div class="card">


      <div class="badge">
        🔓 VIDEO UNLOCKED
      </div>


      <h1 id="title">
        Watch Video
      </h1>


      <div id="playerArea">

        <div class="status">
          Loading video...
        </div>

      </div>


    </div>

  </div>


  <script>

    /* =====================================================
       TELEGRAM
    ===================================================== */

    const tg =
      window.Telegram &&
      window.Telegram.WebApp;


    if (tg) {

      tg.ready();

      tg.expand();

    }


    /* =====================================================
       URL PARAMETERS
    ===================================================== */

    const params =
      new URLSearchParams(
        window.location.search
      );


    // URL থেকে আইডি, লিংক এবং টাইটেল গ্রহণ করা
    let rawVideo =
      params.get("url") ||
      params.get("id");


    const customTitle =
      params.get("title");


    /* =====================================================
       DOM
    ===================================================== */

    const title =
      document.getElementById(
        "title"
      );


    const playerArea =
      document.getElementById(
        "playerArea"
      );


    if (customTitle) {
      title.textContent = decodeURIComponent(customTitle);
    }


    /* =====================================================
       LOAD VIDEO
    ===================================================== */

    function loadVideo() {


      if (!rawVideo) {

        showError(
          "Video ID or URL is missing."
        );

        return;

      }


      let videoUrl = decodeURIComponent(rawVideo).trim();


      playerArea.innerHTML = "";


      const success =
        document.createElement(
          "div"
        );


      success.className =
        "status success";


      success.textContent =
        "আপনি সফলভাবে ভিডিওটি আনলক করেছেন। নিচের player থেকে ভিডিওটি দেখতে পারবেন।";


      playerArea.appendChild(
        success
      );


      /* =================================================
         CHECK IF EMBED OR DIRECT VIDEO
      ================================================= */

      const isEmbed = 
        videoUrl.includes("dood") || 
        videoUrl.includes("playmogo") || 
        videoUrl.includes("streamwish") || 
        videoUrl.includes("/e/") || 
        videoUrl.includes("/d/") ||
        !videoUrl.includes(".");


      if (isEmbed) {

        // ১. যদি শুধু ID দেওয়া থাকে (যেমন: abc123xyz)
        if (!videoUrl.startsWith("http://") && !videoUrl.startsWith("https://")) {
          videoUrl = `https://dood.to/e/${videoUrl}`;
        } 
        // ২. যদি Download লিংক দেওয়া থাকে
        else if (videoUrl.includes("dood.to/d/")) {
          videoUrl = videoUrl.replace("dood.to/d/", "dood.to/e/");
        } else if (videoUrl.includes("playmogo.com/d/")) {
          videoUrl = videoUrl.replace("playmogo.com/d/", "playmogo.com/e/");
        }

        const iframe = 
          document.createElement(
            "iframe"
          );

        iframe.src = videoUrl;
        iframe.allowFullscreen = true;
        iframe.setAttribute("allow", "autoplay; fullscreen");

        playerArea.appendChild(iframe);

      } else {

        const video =
          document.createElement(
            "video"
          );

        video.controls = true;
        video.playsInline = true;
        video.preload = "metadata";

        video.setAttribute(
          "controlsList",
          "nodownload"
        );

        video.setAttribute(
          "oncontextmenu",
          "return false;"
        );

        const source =
          document.createElement(
            "source"
          );

        source.src = videoUrl;
        source.type = "video/mp4";

        video.appendChild(source);

        video.addEventListener(
          "error",
          () => {
            showError(
              "ভিডিওটি চালানো যাচ্ছে না। লিংক বা ভিডিও ফাইলটি পরীক্ষা করুন।"
            );
          }
        );

        playerArea.appendChild(video);

      }

    }


    /* =====================================================
       ERROR
    ===================================================== */

    function showError(
      message
    ) {

      playerArea.innerHTML = `

        <div class="status error">

          ${escapeHTML(
            message
          )}

        </div>

      `;

    }


    /* =====================================================
       ESCAPE HTML
    ===================================================== */

    function escapeHTML(
      value
    ) {

      return String(
        value
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =====================================================
       START
    ===================================================== */

    loadVideo();

  </script>

</body>

</html>
