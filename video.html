<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Watch Video</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        linear-gradient(
          135deg,
          #090014,
          #16002b,
          #001b2e
        );
      color: white;
      font-family:
        Arial,
        sans-serif;
      min-height: 100vh;
    }

    .page {
      width: 100%;
      max-width: 800px;
      margin: auto;
      padding: 18px;
    }

    .back {
      border: 0;
      background: rgba(255,255,255,.1);
      color: white;
      padding: 11px 18px;
      border-radius: 12px;
      cursor: pointer;
      margin-bottom: 18px;
    }

    .card {
      background:
        rgba(255,255,255,.08);
      border: 1px solid
        rgba(255,255,255,.12);
      border-radius: 22px;
      padding: 15px;
      backdrop-filter: blur(15px);
    }

    .badge {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 20px;
      background: #00d084;
      color: #001b12;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 24px;
      margin: 8px 0 16px;
    }

    video {
      width: 100%;
      display: block;
      border-radius: 17px;
      background: #000;
      max-height: 75vh;
    }

    .status {
      text-align: center;
      padding: 35px 15px;
      color: #bbb;
    }

    .error {
      color: #ff7777;
    }

  </style>

</head>

<body>

  <div class="page">

    <button
      class="back"
      onclick="history.back()"
    >
      ← Back
    </button>

    <div class="card">

      <div class="badge">
        🔓 VIDEO UNLOCKED
      </div>

      <h1 id="title">
        Loading...
      </h1>

      <div id="playerArea">

        <div class="status">
          Loading video...
        </div>

      </div>

    </div>

  </div>


  <script>

    const tg =
      window.Telegram &&
      window.Telegram.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();
    }


    const SUPABASE_URL =
      "https://mshoftgubfbkvynndtnu.supabase.co";


    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1zaG9mdGd1YmZia3Z5bm5kdG51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NDkwOTQsImV4cCI6MjEwMjIyNTA5NH0.vcebPtNubpl8s34D-YsZ6jQwH93-MA0wgyDZBiO0Hi4";


    const params =
      new URLSearchParams(
        window.location.search
      );


    const postId =
      params.get("id");


    const title =
      document.getElementById("title");


    const playerArea =
      document.getElementById("playerArea");


    async function loadVideo() {

      if (!postId) {

        showError(
          "Video ID is missing."
        );

        return;

      }


      try {

        const url =
          `${SUPABASE_URL}/rest/v1/posts` +
          `?id=eq.${encodeURIComponent(postId)}` +
          `&select=*`;


        const response =
          await fetch(url, {

            method: "GET",

            headers: {
              apikey:
                SUPABASE_ANON_KEY,

              Authorization:
                `Bearer ${SUPABASE_ANON_KEY}`
            }

          });


        if (!response.ok) {

          throw new Error(
            `Supabase error ${response.status}`
          );

        }


        const posts =
          await response.json();


        if (!posts.length) {

          showError(
            "Video post not found."
          );

          return;

        }


        const post =
          posts[0];


        title.textContent =
          post.title ||
          "Video";


        /*
          Supports either:

          video_url

          or

          video
        */

        let videoUrl =
          post.video_url ||
          post.video ||
          "";


        if (!videoUrl) {

          showError(
            "Video URL not found."
          );

          return;

        }


        /*
          Create video player
        */

        const video =
          document.createElement("video");


        video.controls = true;

        video.playsInline = true;

        video.preload = "metadata";

        video.setAttribute(
          "controlsList",
          "nodownload"
        );


        const source =
          document.createElement("source");


        source.src = videoUrl;

        source.type = "video/mp4";


        video.appendChild(source);


        playerArea.innerHTML = "";

        playerArea.appendChild(video);


      } catch (error) {

        console.error(
          error
        );

        showError(
          "Unable to load video."
        );

      }

    }


    function showError(message) {

      playerArea.innerHTML = `
        <div class="status error">
          ${message}
        </div>
      `;

    }


    loadVideo();

  </script>

</body>

</html>
